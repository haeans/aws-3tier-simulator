<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS 3-Tier 아키텍처 시뮬레이터</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="toolbar">
  <h1><span class="logo">AWS</span>3-Tier 아키텍처 시뮬레이터</h1>
  <button class="btn" id="btn-connect">연결 모드</button>
  <button class="btn" id="btn-template">기본 틀 불러오기</button>
  <button class="btn" id="btn-reset">초기화</button>
  <button class="btn" id="btn-undo" title="되돌리기 (Ctrl+Z)" disabled>↶ 되돌리기</button>
  <button class="btn" id="btn-redo" title="다시 실행 (Ctrl+Y)" disabled>↷ 다시 실행</button>
  <div class="spacer"></div>
  <button class="btn primary" id="btn-validate">검증하기</button>
</header>

<div class="app">
  <aside class="palette autohide-scroll" id="palette"></aside>
  <main class="stage">
    <div class="canvas-wrap autohide-scroll" id="canvas-wrap">
      <div id="world-sizer">
      <div id="world">
        <div id="area-layer"></div>
        <svg id="edge-layer">
          <defs>
            <!-- 양방향 화살표 머리 (start는 자동 반전) -->
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                    markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10"
                    orient="auto-start-reverse">
              <path d="M0,1 L10,5 L0,9 z" fill="#545b64"/>
            </marker>
            <marker id="arrow-sel" viewBox="0 0 10 10" refX="9" refY="5"
                    markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11"
                    orient="auto-start-reverse">
              <path d="M0,1 L10,5 L0,9 z" fill="#0073bb"/>
            </marker>
          </defs>
          <g id="edge-g"></g>
          <g id="flow-g"></g>
          <line id="temp-edge" class="edge-temp" visibility="hidden"/>
        </svg>
        <div id="node-layer"></div>
        <!-- 선택한 연결선의 손잡이는 박스보다 위에 그려 가려지지 않게 -->
        <svg id="handle-layer"><g id="handle-g"></g></svg>
      </div>
      </div>
    </div>
    <div class="zoom-ctrl">
      <button id="zoom-out" title="축소 (Ctrl+휠)">−</button>
      <button id="zoom-reset" title="100%로 되돌리기">100%</button>
      <button id="zoom-in" title="확대 (Ctrl+휠)">+</button>
    </div>
    <aside class="info-panel" id="info-panel" hidden></aside>
    <div class="empty-hint" id="empty-hint">
      <b>[기본 틀 불러오기]로 시작하거나, 왼쪽 팔레트에서 영역과 서비스를 끌어다 놓아보세요.</b><br>
      박스를 끌어서 옮기고, 선택 후 <b>Delete</b> 키로 지울 수 있어요.
    </div>
  </main>
</div>

<footer class="result autohide-scroll" id="result"></footer>

<div class="toast" id="toast"></div>
<div class="tooltip" id="tooltip"></div>

<!-- 스크립트는 순서대로 불러온다 (일반 script 태그: 서버 없이 파일을 바로 열어도 동작). main.js는 반드시 마지막. -->
<script src="js/data/services.js"></script>
<script src="js/data/guide.js"></script>
<script src="js/data/references.js"></script>
<script src="js/data/performance.js"></script>
<script src="js/rules/placement.js"></script>
<script src="js/rules/validation.js"></script>
<script src="js/rules/suggestions.js"></script>
<script src="js/rules/simulation.js"></script>
<script src="js/ui/core.js"></script>
<script src="js/ui/palette.js"></script>
<script src="js/ui/edit.js"></script>
<script src="js/ui/edges.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/ui/result.js"></script>
<script src="js/ui/info.js"></script>
<script src="js/ui/simulate.js"></script>
<script src="js/main.js"></script>
</body>
</html>
