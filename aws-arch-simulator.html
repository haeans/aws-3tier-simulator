<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS 3-Tier 아키텍처 시뮬레이터</title>
<style>
/* =========================================================
   CSS
   ========================================================= */
:root {
  --grid: 20px;
  --node-w: 100px;
  --node-h: 60px;
  --bg: #f5f7fa;
  --panel: #ffffff;
  --line: #e2e7ed;
  --text: #232f3e;
  --muted: #6b7785;
  --accent: #ff9900;
  --select: #0073bb;
  --edge: #545b64;
  /* 영역 색상 */
  --vpc: #248814;
  --az: #147eba;
  --pub-line: #7aa116;
  --pub-bg: #eef6e8;
  --pub-text: #3b6e0f;
  --pri-line: #4a90c2;
  --pri-bg: #e8f2fa;
  --pri-text: #1f5e8a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ----- 상단 툴바 ----- */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.toolbar h1 {
  font-size: 16px;
  margin: 0 16px 0 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toolbar h1 .logo {
  background: #232f3e;
  color: var(--accent);
  font-size: 11px;
  font-weight: 800;
  padding: 3px 6px;
  border-radius: 4px;
  letter-spacing: .5px;
}
.toolbar .spacer { flex: 1; }
.btn {
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid #c9d1da;
  background: #fff;
  color: var(--text);
  cursor: pointer;
}
.btn:hover:not(:disabled) { background: #f0f3f6; }
.btn:disabled { color: #a9b2bc; cursor: not-allowed; background: #fafbfc; }
.btn.active { background: #fff3e0; border-color: var(--accent); color: #c45500; }
.btn.active:hover { background: #ffe8c7; }
.btn.primary { background: var(--accent); border-color: #ec7211; color: #fff; }
.btn.primary:hover:not(:disabled) { background: #ec7211; }
.btn.primary:disabled { background: #ffd9a3; border-color: #ffd9a3; color: #fff; }

/* ----- 본문 레이아웃 ----- */
.app { flex: 1; display: flex; min-height: 0; }

/* ----- 좌측 팔레트 ----- */
.palette {
  width: 240px;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 6px 12px 16px;
}
.cat-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin: 14px 2px 6px;
}
.cat-dot { width: 9px; height: 9px; border-radius: 2px; }
.cat-items { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

/* ----- 서비스 박스 공통 모양 (팔레트·캔버스·고스트) ----- */
.svc {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 4px 6px;
  border: 1.5px solid var(--c);
  background: var(--cbg);
  color: var(--cfg);
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.25;
  word-break: keep-all;      /* 한국어 단어 단위 줄바꿈 */
  overflow-wrap: anywhere;   /* 긴 영문 이름 줄바꿈 */
}
.palette .svc,
.palette .area-chip {
  height: 44px;
  cursor: grab;
  transition: box-shadow .12s, transform .12s;
}
.palette .svc:hover,
.palette .area-chip:hover { box-shadow: 0 2px 6px rgba(0,0,0,.12); transform: translateY(-1px); }

/* 팔레트의 영역 항목 */
.area-chip {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  word-break: keep-all;
  background: #fff;
}
.area-chip.area-vpc     { border: 2px solid var(--vpc); color: var(--vpc); }
.area-chip.area-az      { border: 1.5px dashed var(--az); color: var(--az); }
.area-chip.area-public  { border: 1.5px dashed var(--pub-line); background: var(--pub-bg); color: var(--pub-text); }
.area-chip.area-private,
.area-chip.area-db      { border: 1.5px dashed var(--pri-line); background: var(--pri-bg); color: var(--pri-text); }

/* ----- 중앙 캔버스 ----- */
.stage { flex: 1; position: relative; min-width: 0; }
.canvas-wrap { position: absolute; inset: 0; overflow: auto; background: #fff; }
/* 줌 배율만큼 스크롤 영역 크기를 잡아주는 틀 */
#world-sizer { position: relative; overflow: hidden; }
#world {
  position: relative;
  width: 3000px;
  height: 2000px;
  transform-origin: 0 0;
  background-color: #fff;
  /* 작은 격자(20px) + 큰 격자(100px) */
  background-image:
    linear-gradient(#e6eaef 1px, transparent 1px),
    linear-gradient(90deg, #e6eaef 1px, transparent 1px),
    linear-gradient(#f2f4f7 1px, transparent 1px),
    linear-gradient(90deg, #f2f4f7 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, var(--grid) var(--grid), var(--grid) var(--grid);
}
/* 그리는 순서: 영역 → 연결선 → 서비스 박스 */
#edge-layer, #handle-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
}
.empty-hint {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: #9aa5b1;
  font-size: 14px;
  line-height: 1.7;
  pointer-events: none;
}
.empty-hint b { color: #6b7785; }

/* 줌 조절 버튼 (캔버스 우하단) */
.zoom-ctrl {
  position: absolute;
  right: 24px; bottom: 24px;
  display: flex;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
  z-index: 5;
  overflow: hidden;
}
.zoom-ctrl button {
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  background: none;
  border: none;
  padding: 5px 10px;
  min-width: 32px;
  cursor: pointer;
}
.zoom-ctrl button:hover { background: #f0f3f6; color: var(--text); }
.zoom-ctrl #zoom-reset { min-width: 52px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.empty-hint.hidden { display: none; }

/* 삭제(×) 버튼 공통 */
.del {
  position: absolute;
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1px solid #c9d1da;
  background: #fff;
  color: #5f6b77;
  font-size: 12px;
  line-height: 16px;
  text-align: center;
  cursor: pointer;
  display: none;
  z-index: 2;
}
.del:hover { background: #d13212; border-color: #d13212; color: #fff; }

/* 캔버스 위 서비스 박스 */
.node {
  position: absolute;
  width: var(--node-w);
  height: var(--node-h);
  cursor: move;
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
  touch-action: none;
}
.node.selected { outline: 2px solid var(--select); outline-offset: 2px; }
.node.dragging { opacity: .85; box-shadow: 0 6px 16px rgba(0,0,0,.18); z-index: 10; }
.node .del { top: -9px; right: -9px; }
/* 검증 결과 강조 (오류=빨강, 경고=노랑) */
.node.v-error { box-shadow: 0 0 0 3px #d13212, 0 2px 8px rgba(209,50,18,.35); }
.node.v-warn  { box-shadow: 0 0 0 3px #f2b600, 0 2px 8px rgba(242,182,0,.35); }
.node .v-badge {
  position: absolute;
  top: -9px; left: -9px;
  width: 18px; height: 18px;
  border-radius: 50%;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  line-height: 18px;
  text-align: center;
}
.node.v-error .v-badge { background: #d13212; }
.node.v-warn .v-badge  { background: #f2b600; color: #3d2e00; }
/* 개선·제거 제안 대상 (오류·경고 강조가 없을 때만) */
.node.v-suggest { outline: 2px dashed #2e73b8; outline-offset: 3px; }
.node.v-suggest.selected { outline: 2px solid var(--select); }
.node:hover .del, .node.selected .del { display: block; }
.node.dragging .del { display: none; }

/* 캔버스 위 영역(VPC/AZ/서브넷) */
.area {
  position: absolute;
  border-radius: 4px;
  cursor: move;
  touch-action: none;
}
.area-vpc     { border: 2px solid var(--vpc); }
.area-az      { border: 1.5px dashed var(--az); }
.area-public  { border: 1.5px dashed var(--pub-line); background: var(--pub-bg); }
.area-private,
.area-db      { border: 1.5px dashed var(--pri-line); background: var(--pri-bg); }
.area.selected { box-shadow: 0 0 0 2px var(--select); }
.area-label {
  position: absolute;
  top: 6px; left: 8px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  font-weight: 700;
  white-space: nowrap;
  cursor: help;   /* 이름표에 마우스를 올리면 설명 툴팁 */
}
.area-vpc .area-label     { color: var(--vpc); top: 0; left: 0; }
.area-az .area-label      { color: var(--az); }
.area-public .area-label  { color: var(--pub-text); }
.area-private .area-label,
.area-db .area-label      { color: var(--pri-text); }
.vpc-tag {
  background: var(--vpc);
  color: #fff;
  font-size: 11.5px;
  padding: 3px 8px;
  border-bottom-right-radius: 4px;
}
.area .del { top: 4px; right: 4px; }
.area .resize {
  position: absolute;
  width: 12px; height: 12px;
  background: #fff;
  border: 1.5px solid #8a96a3;
  border-radius: 2px;
  cursor: nwse-resize;
  display: none;
  z-index: 2;
}
.area .resize.br { right: -6px; bottom: -6px; }
.area .resize.tl { left: -6px; top: -6px; }
.area:hover > .del, .area.selected > .del,
.area:hover > .resize, .area.selected > .resize { display: block; }

/* 연결선 (직각 경로) */
.edge { stroke: var(--edge); stroke-width: 2; fill: none; stroke-linejoin: round; }
.edge.selected { stroke: var(--select); stroke-width: 2.5; }
.edge-hit { stroke: transparent; stroke-width: 14; fill: none; pointer-events: stroke; cursor: pointer; }
.edge-temp { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
/* 동적 흐름 점 (검증 후 표시) */
.flow-dot { stroke: #fff; stroke-width: 1.2; pointer-events: none; }
.flow-legend { margin-top: 6px; font-size: 11.5px; color: var(--muted); display: flex; gap: 12px; align-items: center; }
.flow-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
/* 마우스를 올린 연결선 강조: 그 선은 진하게, 나머지는 흐리게, 양 끝 박스는 테두리 강조 */
.edge { transition: opacity .12s; }
#edge-layer.dimmed .edge:not(.hl):not(.selected) { opacity: .2; }
.edge.hl { stroke: #232f3e; stroke-width: 3; }
.node.edge-end { box-shadow: 0 0 0 3px rgba(35,47,62,.35); }
/* 선택한 연결선의 조절 손잡이 (끝점: 연결 변 바꾸기 / 가운데: 경로 옮기기) */
#handle-layer { z-index: 20; }
.edge-handle { cursor: move; }
.edge-handle.mid-x { cursor: ew-resize; }
.edge-handle.mid-y { cursor: ns-resize; }
.edge-handle .handle-hit { fill: transparent; pointer-events: all; }   /* 잡기 쉽게 넓은 투명 영역 */
.edge-handle .handle-shape { fill: #fff; stroke: var(--select); stroke-width: 2; pointer-events: all; }
.edge-handle:hover .handle-shape { fill: #dcecf9; }

/* 연결 모드 */
body.connect-mode .node { cursor: crosshair; }
body.connect-mode .area { cursor: default; }
body.connect-mode .del,
body.connect-mode .resize { display: none !important; }
.node.connect-from { box-shadow: 0 0 0 4px rgba(255,153,0,.55); }
/* 연결점: 박스 네 변의 중앙 (연결 모드에서 마우스를 올리면 표시) */
.node .anchor {
  position: absolute;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--accent);
  transform: translate(-50%, -50%);
  display: none;
  z-index: 3;
}
.node .anchor[data-side="top"]    { left: 50%;  top: 0; }
.node .anchor[data-side="right"]  { left: 100%; top: 50%; }
.node .anchor[data-side="bottom"] { left: 50%;  top: 100%; }
.node .anchor[data-side="left"]   { left: 0;    top: 50%; }
.node .anchor:hover { background: var(--accent); transform: translate(-50%, -50%) scale(1.3); }
body.connect-mode .node:hover .anchor,
body.connect-mode .node.connect-from .anchor { display: block; }

/* 팔레트에서 끌고 다니는 미리보기 */
.ghost {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  opacity: .9;
  box-shadow: 0 6px 16px rgba(0,0,0,.2);
}
.ghost.area { opacity: .75; }
.ghost.outside { opacity: .35; }

/* ----- 하단 결과 영역 ----- */
.result {
  background: var(--panel);
  border-top: 1px solid var(--line);
  padding: 10px 16px;
  font-size: 13px;
  min-height: 44px;
  max-height: 34vh;
  overflow-y: auto;
}
.result-head { display: flex; align-items: center; gap: 10px; min-height: 24px; }
.result .label { font-weight: 700; }
.result .msg { color: var(--muted); }
.status {
  font-weight: 800;
  font-size: 12.5px;
  padding: 3px 10px;
  border-radius: 999px;
}
.status.ok    { background: #e6f4e8; color: #1d6b30; }
.status.warn  { background: #fff4cc; color: #7a5c00; }
.status.error { background: #fdecea; color: #b0260e; }
.issues { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.issue {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  border-left: 4px solid;
  line-height: 1.5;
}
.issue.error { background: #fdf3f1; border-color: #d13212; }
.issue.warn  { background: #fffaea; border-color: #f2b600; }
.issue.clickable { cursor: pointer; }
.issue.clickable:hover { filter: brightness(.97); }
.issue .lv { font-weight: 800; flex-shrink: 0; }
.issue.error .lv { color: #b0260e; }
.issue.warn .lv  { color: #7a5c00; }
.issue .rt { font-weight: 700; flex-shrink: 0; color: var(--text); }
.issue .im { color: #3a4552; }
/* 개선·제거 제안 목록 */
.suggest-title { margin: 10px 0 4px; font-weight: 700; font-size: 12.5px; color: var(--muted); }
.issue.improve { background: #f0f6fc; border-color: #2e73b8; }
.issue.remove  { background: #f5f3f8; border-color: #7d6b9e; }
.issue.improve .lv { color: #1d4f82; }
.issue.remove .lv  { color: #5b4a7a; }
.issue .act { display: block; margin-top: 2px; color: #1d4f82; }
.issue.remove .act { color: #5b4a7a; }

/* ----- 안내 메시지(토스트) ----- */
/* ----- 스크롤바: 평소엔 숨기고 스크롤하는 동안만 표시 ----- */
.autohide-scroll { scrollbar-width: thin; scrollbar-color: transparent transparent; }
.autohide-scroll.scrolling { scrollbar-color: rgba(35,47,62,.3) transparent; }
/* 표준 속성을 지원하지 않는 브라우저용 */
.autohide-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.autohide-scroll::-webkit-scrollbar-track,
.autohide-scroll::-webkit-scrollbar-corner { background: transparent; }
.autohide-scroll::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; }
.autohide-scroll.scrolling::-webkit-scrollbar-thumb { background: rgba(35,47,62,.3); }

/* ----- 서비스 설명 툴팁 ----- */
.tooltip {
  position: fixed;
  z-index: 3000;
  max-width: 260px;
  padding: 8px 11px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 4px 14px rgba(0,0,0,.12);
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--text);
  pointer-events: none;
  opacity: 0;
  transition: opacity .12s;
}
.tooltip.show { opacity: 1; }
.tt-head { display: flex; align-items: center; gap: 6px; font-weight: 700; margin-bottom: 2px; }
.tt-cat { display: flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.tt-desc { color: #3a4552; }
.tt-zone { margin-top: 5px; padding-top: 5px; border-top: 1px solid #eef1f4; font-size: 11.5px; color: var(--muted); }
.tt-zone b { color: var(--text); font-weight: 600; }

.toast {
  position: fixed;
  left: 50%;
  top: 64px;
  transform: translate(-50%, -10px);
  background: #232f3e;
  color: #fff;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 13.5px;
  box-shadow: 0 6px 20px rgba(0,0,0,.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 2000;
  max-width: 80vw;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.warn { background: #b4400f; }
</style>
</head>
<body>

<header class="toolbar">
  <h1><span class="logo">AWS</span>3-Tier 아키텍처 시뮬레이터</h1>
  <button class="btn" id="btn-connect">연결 모드</button>
  <button class="btn" id="btn-template">기본 틀 불러오기</button>
  <button class="btn" id="btn-reset">초기화</button>
  <div class="spacer"></div>
  <button class="btn primary" id="btn-validate">검증하기</button>
</header>

<div class="app">
  <aside class="palette autohide-scroll" id="palette"></aside>
  <main class="stage">
    <div class="canvas-wrap autohide-scroll" id="canvas-wrap">
      <div id="world-sizer">
      <div id="world">
        <div id="area-layer"></div>
        <svg id="edge-layer">
          <defs>
            <!-- 양방향 화살표 머리 (start는 자동 반전) -->
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                    markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10"
                    orient="auto-start-reverse">
              <path d="M0,1 L10,5 L0,9 z" fill="#545b64"/>
            </marker>
            <marker id="arrow-sel" viewBox="0 0 10 10" refX="9" refY="5"
                    markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11"
                    orient="auto-start-reverse">
              <path d="M0,1 L10,5 L0,9 z" fill="#0073bb"/>
            </marker>
          </defs>
          <g id="edge-g"></g>
          <g id="flow-g"></g>
          <line id="temp-edge" class="edge-temp" visibility="hidden"/>
        </svg>
        <div id="node-layer"></div>
        <!-- 선택한 연결선의 손잡이는 박스보다 위에 그려 가려지지 않게 -->
        <svg id="handle-layer"><g id="handle-g"></g></svg>
      </div>
      </div>
    </div>
    <div class="zoom-ctrl">
      <button id="zoom-out" title="축소 (Ctrl+휠)">−</button>
      <button id="zoom-reset" title="100%로 되돌리기">100%</button>
      <button id="zoom-in" title="확대 (Ctrl+휠)">+</button>
    </div>
    <div class="empty-hint" id="empty-hint">
      <b>[기본 틀 불러오기]로 시작하거나, 왼쪽 팔레트에서 영역과 서비스를 끌어다 놓아보세요.</b><br>
      박스를 끌어서 옮기고, 선택 후 <b>Delete</b> 키로 지울 수 있어요.
    </div>
  </main>
</div>

<footer class="result autohide-scroll" id="result"></footer>

<div class="toast" id="toast"></div>

/* =========================================================
   배치 제한 규칙
   ========================================================= */

// 받침 있는 영문 이름 (조사 은/는 선택용)
const BATCHIM_NAMES = new Set([
  'IAM', 'ECR', 'NAT', 'Client VPN', 'CodeCommit', 'CodePipeline',
  'CloudTrail', 'CloudFormation', 'Auto Scaling',
]);
// 이름 뒤에 '은/는'을 붙여 돌려준다
function eunNeun(word) {
  const code = word.charCodeAt(word.length - 1);
  const hasBatchim = (code >= 0xAC00 && code <= 0xD7A3)
    ? (code - 0xAC00) % 28 !== 0
    : BATCHIM_NAMES.has(word);
  return word + (hasBatchim ? '은' : '는');
}

// 서비스 박스의 현재 위치 구역: 'outside' | 'vpc'(VPC·AZ 안, 서브넷 밖) | 'public' | 'private' | 'db'
function zoneOf(node) {
  const p = findContainer(node.parentContainer);
  if (!p) return 'outside';
  if (p.type === 'vpc' || p.type === 'az') return 'vpc';
  return p.type;
}

// allowedZone별 배치 허용 여부와 안내 메시지
const PLACEMENT_RULES = {
  outside: {
    test: zone => zone === 'outside',
    message: name => `${eunNeun(name)} VPC 밖에서 사용하는 서비스예요. VPC 바깥에 놓아주세요.`,
  },
  vpcEdge: {
    test: zone => zone === 'outside' || zone === 'vpc',
    message: name => `${eunNeun(name)} 서브넷 안에는 놓을 수 없어요. VPC 바깥이나 서브넷 밖의 VPC 영역에 놓아주세요.`,
  },
  private: {
    test: zone => zone === 'private',
    message: name => `${eunNeun(name)} 프라이빗 서브넷 안에만 놓을 수 있어요.`,
  },
  // 여러 AZ에 걸치는 그룹(Auto Scaling 등): 프라이빗 서브넷 또는 VPC 안 서브넷 밖
  vpcInner: {
    test: zone => zone === 'private' || zone === 'vpc',
    message: name => `${eunNeun(name)} 프라이빗 서브넷이나, VPC 안의 서브넷 밖(AZ 사이 빈 곳 등)에만 놓을 수 있어요.`,
  },
  db: {
    test: zone => zone === 'db',
    message: name => `${eunNeun(name)} DB 서브넷 안에만 놓을 수 있어요.`,
  },
  any: {
    test: () => true,
    message: () => '',
  },
};

// 영역 중첩 규칙: VPC > AZ > 서브넷 (parentType = 소속 영역 종류, 없으면 null)
const NESTING_RULES = {
  vpc: {
    test: parentType => parentType === null,
    message: () => 'VPC는 다른 영역 안에 놓을 수 없어요. VPC 바깥의 빈 곳에 놓아주세요.',
  },
  az: {
    test: parentType => parentType === 'vpc',
    message: parentType => parentType === null
      ? 'AZ(가용 영역)는 VPC 안에 놓아야 해요.'
      : 'AZ(가용 영역)는 서브넷이나 다른 AZ 안에 놓을 수 없어요. VPC 안의 빈 곳에 놓아주세요.',
  },
  subnet: {
    test: parentType => parentType === 'az',
    message: (parentType, name) => SUBNET_TYPES.includes(parentType)
      ? '서브넷 안에 다른 서브넷을 넣을 수 없어요. AZ 안의 빈 곳에 놓아주세요.'
      : `${eunNeun(name)} AZ(가용 영역) 안에 놓아야 해요.`,
  },
};
const nestingRuleOf = type => NESTING_RULES[SUBNET_TYPES.includes(type) ? 'subnet' : type];

// 전체 상태에서 규칙 위반을 찾는다. 방금 조작한 항목(actedId)의 위반을 우선 안내.
function findViolation(actedId) {
  const list = [];
  state.containers.forEach(c => {
    const parent = findContainer(c.parentContainer);
    const parentType = parent ? parent.type : null;
    const rule = nestingRuleOf(c.type);
    if (!rule.test(parentType)) {
      list.push({ id: c.id, msg: rule.message(parentType, AREA_MAP[c.type].name) });
    }
  });
  state.nodes.forEach(n => {
    const svc = SVC_MAP[n.type];
    const rule = PLACEMENT_RULES[svc.allowedZone];
    if (!rule.test(zoneOf(n))) list.push({ id: n.id, msg: rule.message(svc.name) });
  });
  if (!list.length) return null;
  const own = list.find(v => v.id === actedId);
  return own ? own.msg : `그렇게 하면 다른 항목의 위치가 규칙에 어긋나요. ${list[0].msg}`;
}

/* =========================================================
   검증 규칙
   - validated: true 인 서비스만 검증에 사용
   - "연결" = 두 박스 사이의 직접 연결선, 방향 구분 없음
   - check(ctx)는 문제 목록 [{ message, nodeIds }]을 돌려준다 (빈 배열 = 통과)
   ========================================================= */
const USER_TYPES = ['smartphone', 'tablet', 'pc'];
const RDS_TYPES  = ['rds', 'rds-replica', 'rds-standby'];

// 규칙에서 쓰는 조회 도구 모음
// includeAll: true면 검증 대상이 아닌 서비스도 포함 (개선·제거 제안용)
function buildContext(includeAll = false) {
  const nodes = includeAll ? state.nodes : state.nodes.filter(n => SVC_MAP[n.type].validated);
  const ids = new Set(nodes.map(n => n.id));
  const adj = new Map(nodes.map(n => [n.id, new Set()]));
  state.edges.forEach(ed => {
    if (!ids.has(ed.from) || !ids.has(ed.to)) return;
    adj.get(ed.from).add(ed.to);
    adj.get(ed.to).add(ed.from);
  });
  return {
    // 해당 종류의 박스 목록
    ofType: (...types) => nodes.filter(n => types.includes(n.type)),
    // n과 직접 연결된 박스 중 해당 종류
    neighborsOf: (n, ...types) => [...adj.get(n.id)].map(findNode).filter(m => types.includes(m.type)),
    zoneOf,
    // 박스가 속한 AZ (서브넷이면 그 부모 AZ)
    azOf: n => {
      let c = findContainer(n.parentContainer);
      while (c && c.type !== 'az') c = findContainer(c.parentContainer);
      return c || null;
    },
    nameOf: n => SVC_MAP[n.type].name,
  };
}

const VALIDATION_RULES = [
  {
    id: 1, level: 'error', message: '진입 경로',
    check(ctx) {
      const users = ctx.ofType(...USER_TYPES), igws = ctx.ofType('igw'), lbs = ctx.ofType('lb');
      const missing = [];
      if (!users.length) missing.push('사용자(스마트폰/태블릿/PC)');
      if (!igws.length)  missing.push('IGW');
      if (!lbs.length)   missing.push('Load Balancer');
      if (missing.length) {
        return [{ message: `${missing.join(', ')}가 없어요. 사용자 → IGW → Load Balancer로 들어오는 길이 필요해요.` }];
      }
      // Load Balancer와 연결된 IGW
      const gates = igws.filter(i => ctx.neighborsOf(i, 'lb').length);
      if (!gates.length) {
        return [{ message: 'IGW와 Load Balancer가 연결되어 있지 않아요. 인터넷 요청이 Load Balancer로 가도록 둘을 연결해주세요.' }];
      }
      // 사용자 — IGW 또는 사용자 — CloudFront — IGW
      const reached = gates.some(i =>
        ctx.neighborsOf(i, ...USER_TYPES).length ||
        ctx.neighborsOf(i, 'cloudfront').some(cf => ctx.neighborsOf(cf, ...USER_TYPES).length));
      if (!reached) {
        return [{ message: '사용자가 IGW까지 닿지 않아요. 사용자를 IGW에 직접 연결하거나, CloudFront를 거쳐 IGW에 연결해주세요.' }];
      }
      return [];
    },
  },
  {
    id: 2, level: 'error', message: '계층 배치',
    check(ctx) {
      const issues = [];
      ctx.ofType('igw').forEach(n => {
        if (SUBNET_TYPES.includes(ctx.zoneOf(n))) issues.push({ nodeIds: [n.id],
          message: 'IGW는 서브넷 안에 두지 않아요. VPC 경계(서브넷 바깥)에 놓아주세요.' });
      });
      ctx.ofType('lb').forEach(n => {
        if (ctx.zoneOf(n) !== 'public') issues.push({ nodeIds: [n.id],
          message: 'Load Balancer는 퍼블릭 서브넷에 있어야 인터넷에서 오는 요청을 받을 수 있어요.' });
      });
      ctx.ofType('ec2').forEach(n => {
        if (ctx.zoneOf(n) !== 'private') issues.push({ nodeIds: [n.id],
          message: 'EC2 앱 서버는 프라이빗 서브넷에 두어야 외부에서 직접 접근할 수 없어요.' });
      });
      return issues;
    },
  },
  {
    id: 3, level: 'error', message: '흐름 연결',
    check(ctx) {
      const lbs = ctx.ofType('lb'), ec2s = ctx.ofType('ec2');
      if (!lbs.length && !ec2s.length) return [{ message: 'Load Balancer와 EC2가 없어요.' }];
      if (!lbs.length)  return [{ message: 'Load Balancer가 없어요. 요청을 EC2로 나눠줄 Load Balancer가 필요해요.' }];
      if (!ec2s.length) return [{ message: 'EC2(앱 서버)가 없어요. 요청을 처리할 EC2가 필요해요.' }];
      if (!lbs.some(lb => ctx.neighborsOf(lb, 'ec2').length)) {
        return [{ message: 'Load Balancer와 EC2가 연결되어 있지 않아요. Load Balancer가 받은 요청을 EC2로 넘기도록 연결해주세요.' }];
      }
      return [];
    },
  },
  {
    id: 4, level: 'error', message: 'DB 보호',
    check(ctx) {
      const issues = [];
      ctx.ofType(...RDS_TYPES).forEach(db => {
        const name = ctx.nameOf(db);
        if (ctx.zoneOf(db) !== 'db') issues.push({ nodeIds: [db.id],
          message: `${eunNeun(name)} DB 서브넷에 있어야 해요. 데이터는 가장 안쪽에 두어 보호해요.` });
        ctx.neighborsOf(db, ...USER_TYPES, 'igw').forEach(other => issues.push({ nodeIds: [db.id, other.id],
          message: `DB가 인터넷에 직접 노출돼 있어요. ${name} — ${ctx.nameOf(other)} 연결을 지우고 앱 서버(EC2)를 거치도록 연결해주세요.` }));
        ctx.neighborsOf(db, 'dbadmin').forEach(admin => issues.push({ nodeIds: [db.id, admin.id],
          message: `DB 관리자가 ${name}에 직접 연결돼 있어요. Client VPN을 거쳐서 접속하도록 연결해주세요.` }));
      });
      return issues;
    },
  },
  {
    id: 5, level: 'error', message: '앱-DB 연결',
    check(ctx) {
      const ec2s = ctx.ofType('ec2'), rdss = ctx.ofType('rds');
      if (!ec2s.length && !rdss.length) return [{ message: 'EC2와 RDS가 없어요.' }];
      if (!rdss.length) return [{ message: 'RDS가 없어요. 앱 서버가 데이터를 저장할 RDS가 필요해요.' }];
      if (!ec2s.length) return [{ message: 'EC2(앱 서버)가 없어요. RDS를 사용할 EC2가 필요해요.' }];
      if (!ec2s.some(n => ctx.neighborsOf(n, 'rds').length)) {
        return [{ message: 'EC2와 RDS가 연결되어 있지 않아요. 앱 서버가 DB를 쓸 수 있도록 연결해주세요.' }];
      }
      return [];
    },
  },
  {
    id: 6, level: 'warn', message: '외부 통신',
    check(ctx) {
      const privateEc2 = ctx.ofType('ec2').filter(n => ctx.zoneOf(n) === 'private');
      if (!privateEc2.length) return [];
      const nats = ctx.ofType('nat');
      if (nats.some(n => ctx.zoneOf(n) === 'public')) return [];
      return [{
        nodeIds: nats.map(n => n.id),
        message: nats.length
          ? 'NAT가 퍼블릭 서브넷에 있지 않아요. 프라이빗 서브넷의 EC2가 인터넷으로 나가려면(업데이트 등) NAT가 퍼블릭 서브넷에 있어야 해요.'
          : 'NAT가 없어요. 프라이빗 서브넷의 EC2가 업데이트 등을 위해 인터넷으로 나갈 수 있도록 퍼블릭 서브넷에 NAT를 놓아주세요.',
      }];
    },
  },
  {
    id: 7, level: 'warn', message: '고가용성',
    check(ctx) {
      const issues = [];
      // EC2: 서로 다른 AZ에 2개 이상
      const ec2s = ctx.ofType('ec2');
      const ec2Azs = new Set(ec2s.map(ctx.azOf).filter(Boolean));
      if (ec2Azs.size < 2) issues.push({
        nodeIds: ec2s.map(n => n.id),
        message: ec2Azs.size === 0
          ? 'EC2가 AZ 안에 없어요. 서로 다른 AZ에 EC2를 2개 이상 두면 한 AZ에 장애가 나도 서비스가 계속돼요.'
          : 'EC2가 한 AZ에만 있어요. 다른 AZ에도 EC2를 두면 한 AZ에 장애가 나도 서비스가 계속돼요.',
      });
      // RDS: RDS와 RDS Standby가 서로 다른 AZ
      const rdss = ctx.ofType('rds'), standbys = ctx.ofType('rds-standby');
      const paired = rdss.some(r => standbys.some(s => {
        const a = ctx.azOf(r), b = ctx.azOf(s);
        return a && b && a !== b;
      }));
      if (!paired) issues.push({
        nodeIds: [...rdss, ...standbys].map(n => n.id),
        message: !rdss.length
          ? 'RDS가 없어서 DB 이중화를 확인할 수 없어요.'
          : !standbys.length
            ? 'RDS Standby가 없어요. 다른 AZ에 RDS Standby를 두면 DB 장애 때 자동으로 넘어갈 수 있어요.'
            : 'RDS와 RDS Standby가 서로 다른 AZ에 있지 않아요. 두 박스를 서로 다른 AZ의 DB 서브넷에 놓아주세요.',
      });
      return issues;
    },
  },
];

/* ----- 개선·제거 제안 -----
   정상/경고/오류 판정에는 영향을 주지 않고, 더 나은 설계 방향만 알려준다.
   - kind: 'improve'(개선) | 'remove'(제거)
   - 검증 대상이 아닌 서비스(validated: false)도 함께 본다.
   - check(ctx)는 [{ reason, action, nodeIds }]를 돌려준다 (빈 배열 = 제안 없음) */
const SUGGESTION_RULES = [
  {
    id: 1, kind: 'improve', title: 'DB 캐싱',
    check(ctx) {
      const caches = ctx.ofType('elasticache');
      const pairs = ctx.ofType('ec2').flatMap(e => ctx.neighborsOf(e, 'rds').map(r => [e, r]));
      if (!pairs.length) return [];
      if (ctx.ofType('ec2').some(e => ctx.neighborsOf(e, 'elasticache').length)) return [];
      return [{
        nodeIds: [...new Set(pairs.flat().map(n => n.id))],
        reason: 'EC2가 RDS를 직접 조회하고 있어요. 같은 데이터를 반복해서 읽으면 DB 부담이 커지고 응답이 느려져요.',
        action: caches.length
          ? 'ElastiCache가 있지만 EC2와 연결되어 있지 않아요. EC2와 연결해 자주 쓰는 데이터를 캐싱하세요.'
          : 'ElastiCache를 DB 서브넷에 두고 EC2와 연결해 자주 쓰는 데이터를 캐싱하세요.',
      }];
    },
  },
  {
    id: 2, kind: 'improve', title: 'CDN 사용',
    check(ctx) {
      const users = ctx.ofType(...USER_TYPES);
      if (!users.length) return [];
      // 사용자가 S3나 EC2에 바로 붙어 있는 경우
      const direct = users.filter(u => ctx.neighborsOf(u, 's3', 'ec2').length);
      if (direct.length) return [{
        nodeIds: direct.flatMap(u => [u.id, ...ctx.neighborsOf(u, 's3', 'ec2').map(n => n.id)]),
        reason: '사용자가 S3나 EC2에서 파일을 직접 받아가요. 멀리 있는 사용자는 느리고, 서버가 모든 전송을 떠안아요.',
        action: '정적 파일은 S3에 두고 CloudFront를 거쳐 전달하세요. (사용자 — CloudFront — S3 / IGW)',
      }];
      // 진입 경로에 CloudFront가 전혀 없는 경우
      if (users.some(u => ctx.neighborsOf(u, 'cloudfront').length)) return [];
      return [{
        nodeIds: users.map(u => u.id),
        reason: '사용자 요청이 CDN 없이 바로 서버로 가요. 이미지·정적 파일까지 매번 서버가 처리해요.',
        action: '사용자와 IGW 사이에 CloudFront를 두세요. (사용자 — CloudFront — IGW)',
      }];
    },
  },
  {
    id: 3, kind: 'improve', title: 'S3 전용 통로',
    check(ctx) {
      if (ctx.ofType('vpce').length) return [];
      const ec2s = ctx.ofType('ec2').filter(e => ctx.zoneOf(e) === 'private' && ctx.neighborsOf(e, 's3').length);
      if (!ec2s.length) return [];
      return [{
        nodeIds: ec2s.flatMap(e => [e.id, ...ctx.neighborsOf(e, 's3').map(n => n.id)]),
        reason: '프라이빗 서브넷의 EC2가 S3에 갈 때 NAT를 거치면 인터넷 쪽으로 나가고, 데이터 처리 비용도 들어요.',
        action: 'VPC Endpoints를 VPC 안(서브넷 밖)에 두고 EC2와 S3 사이를 연결하세요.',
      }];
    },
  },
  {
    id: 4, kind: 'improve', title: '자동 확장',
    check(ctx) {
      const ec2s = ctx.ofType('ec2');
      if (ec2s.length < 2 || ctx.ofType('autoscaling').length) return [];
      return [{
        nodeIds: ec2s.map(e => e.id),
        reason: 'EC2 수가 고정되어 있어요. 사용자가 몰리면 느려지고, 한가할 땐 남는 서버 비용이 들어요.',
        action: 'Auto Scaling을 프라이빗 서브넷에 두고 EC2를 그룹으로 묶어 자동으로 늘리고 줄이세요.',
      }];
    },
  },
  {
    id: 5, kind: 'improve', title: '모니터링·감사',
    check(ctx) {
      if (!ctx.ofType('ec2').length) return [];
      const missing = [];
      if (!ctx.ofType('cloudwatch').length) missing.push('CloudWatch(상태 모니터링·알림)');
      if (!ctx.ofType('cloudtrail').length) missing.push('CloudTrail(작업 기록)');
      if (!missing.length) return [];
      return [{
        nodeIds: [],
        reason: '서버 상태나 누가 무엇을 바꿨는지 볼 수단이 없어요. 문제가 생겨도 원인을 찾기 어려워요.',
        action: `${missing.join(', ')}을 VPC 밖에 추가하세요.`,
      }];
    },
  },
  {
    id: 6, kind: 'remove', title: 'Bastion 서버',
    check(ctx) {
      // 관리 접속용으로 보이는 EC2: DB 관리자와 바로 연결됐거나, 퍼블릭 서브넷에서 Load Balancer 없이 쓰이는 EC2
      const bastions = ctx.ofType('ec2').filter(e =>
        ctx.neighborsOf(e, 'dbadmin').length ||
        (ctx.zoneOf(e) === 'public' && !ctx.neighborsOf(e, 'lb').length));
      if (!bastions.length) return [];
      return [{
        nodeIds: bastions.map(e => e.id),
        reason: '관리 접속용 서버(Bastion)로 보이는 EC2가 있어요. 인터넷에 열린 접속 포트와 서버를 따로 관리해야 하고 비용도 들어요.',
        action: '이 EC2를 지우고 Session Manager로 서버에 접속하세요. DB 접속은 Client VPN을 거치면 돼요.',
      }];
    },
  },
  {
    id: 7, kind: 'remove', title: '불필요한 연결',
    check(ctx) {
      // 실제로는 서로 통신하지 않는 조합: [서비스, 상대 종류들, 이유, 방안]
      const PAIRS = [
        ['elasticache', RDS_TYPES,
          'ElastiCache는 RDS 앞에서 요청을 대신 전달하지 않아요. 앱(EC2)이 캐시와 DB에 각각 접속해요.',
          '이 연결을 지우고 EC2 — ElastiCache, EC2 — RDS로 각각 연결하세요.'],
        ['autoscaling', [...RDS_TYPES, 'elasticache'],
          'Auto Scaling은 EC2를 묶어 늘리고 줄이는 관리 그룹이라 DB와 직접 통신하지 않아요.',
          '이 연결을 지우고 Auto Scaling은 EC2와만 연결하세요. DB에는 EC2가 접속해요.'],
      ];
      const issues = [];
      PAIRS.forEach(([type, others, reason, action]) => {
        ctx.ofType(type).forEach(n => ctx.neighborsOf(n, ...others).forEach(m => issues.push({
          nodeIds: [n.id, m.id],
          reason: `${ctx.nameOf(n)} — ${ctx.nameOf(m)} 연결: ${reason}`,
          action,
        })));
      });
      return issues;
    },
  },
];

// 모든 규칙을 실행해 결과를 만든다
function validateArchitecture() {
  const ctx = buildContext();
  const issues = [];
  VALIDATION_RULES.forEach(rule => {
    rule.check(ctx).forEach(it => issues.push({ rule, message: it.message, nodeIds: it.nodeIds || [] }));
  });
  // 박스별 강조 단계 (오류가 경고보다 우선)
  const nodeLevels = new Map();
  issues.forEach(i => i.nodeIds.forEach(id => {
    if (i.rule.level === 'error' || !nodeLevels.has(id)) nodeLevels.set(id, i.rule.level);
  }));
  const status = issues.some(i => i.rule.level === 'error') ? 'error' : issues.length ? 'warn' : 'ok';

  // 개선·제거 제안 (판정과 별개)
  const allCtx = buildContext(true);
  const suggestions = [];
  SUGGESTION_RULES.forEach(rule => {
    rule.check(allCtx).forEach(it => suggestions.push({ rule, reason: it.reason, action: it.action, nodeIds: it.nodeIds || [] }));
  });
  const suggestNodes = new Set(suggestions.flatMap(s => s.nodeIds).filter(id => !nodeLevels.has(id)));
  return { status, issues, nodeLevels, suggestions, suggestNodes };
}

/* =========================================================
   UI·드래그 로직
   UI-1 상태·공통 유틸        UI-2 소속 판정·동작 검사
   UI-3 팔레트·설명 툴팁      UI-4 추가·삭제·선택·이동·크기 조절
   UI-5 연결선                UI-6 그리기
   UI-7 줌·저장               UI-8 검증 결과 표시
   UI-9 기본 틀·이벤트·시작
   ========================================================= */

/* ---------------------------------------------------------
   UI-1. 상태·공통 유틸
   --------------------------------------------------------- */

// ----- 캔버스 상태 -----
const state = {
  nodes: [],       // { id, type, x, y, parentContainer }
  containers: [],  // { id, type, x, y, width, height, parentContainer, label }
  edges: [],       // { id, from, to, fromSide, toSide, mid } - 연결 변·경로는 null이면 자동 (UI-5 참고)
};
let idSeq = 1;
const newId = prefix => `${prefix}${idSeq++}`;   // n=서비스, c=영역, e=연결선
let selectedId = null;
let connectMode = false;   // 연결 모드 켜짐 여부
let connectFrom = null;    // 연결 시작 박스 id
let connectFromSide = null; // 연결 시작 변 (연결점을 직접 골랐을 때)
const elMap = new Map();   // id → DOM 요소
let validation = null;     // 마지막 검증 결과 { sig, status, issues, nodeLevels }
let resultNote = '아직 검증하지 않았어요.';   // 검증 결과가 없을 때 보여줄 문구
let zoom = 1;              // 캔버스 배율

// ----- DOM 참조 -----
const $palette   = document.getElementById('palette');
const $wrap      = document.getElementById('canvas-wrap');
const $world     = document.getElementById('world');
const $areaLayer = document.getElementById('area-layer');
const $edgeG     = document.getElementById('edge-g');
const $tempEdge  = document.getElementById('temp-edge');
const $handleG   = document.getElementById('handle-g');
const $nodeLayer = document.getElementById('node-layer');
const $emptyHint = document.getElementById('empty-hint');
const $toast     = document.getElementById('toast');
const $btnConnect = document.getElementById('btn-connect');
const $result    = document.getElementById('result');
const $sizer     = document.getElementById('world-sizer');
const $zoomLabel = document.getElementById('zoom-reset');

const LOCK_SVG = '<svg width="11" height="12" viewBox="0 0 11 12" aria-hidden="true">' +
  '<rect x="1" y="5" width="9" height="7" rx="1.2" fill="currentColor"/>' +
  '<path d="M3 5V3.5a2.5 2.5 0 0 1 5 0V5" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>';

// ----- 유틸 -----
const snap = v => Math.round(v / GRID) * GRID;
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const findNode = id => state.nodes.find(n => n.id === id);
const findContainer = id => state.containers.find(c => c.id === id);
const isContainer = item => item.width !== undefined;

// 화면 좌표 → 캔버스(world) 좌표 (스크롤·줌 반영)
function clientToWorld(cx, cy) {
  const r = $world.getBoundingClientRect();
  return { x: (cx - r.left) / zoom, y: (cy - r.top) / zoom };
}
// 캔버스(world) 좌표 → 화면 좌표
function worldToClient(wx, wy) {
  const r = $world.getBoundingClientRect();
  return { x: r.left + wx * zoom, y: r.top + wy * zoom };
}

// 포인터가 캔버스 보이는 영역 안에 있는지
function isOverCanvas(cx, cy) {
  const r = $wrap.getBoundingClientRect();
  return cx >= r.left && cx <= r.left + $wrap.clientWidth &&
         cy >= r.top  && cy <= r.top + $wrap.clientHeight;
}

// 좌상단 좌표를 격자에 스냅하고 캔버스 범위 안으로 맞춤
function fitRect(x, y, w, h) {
  return {
    x: clamp(snap(x), 0, $world.clientWidth - w),
    y: clamp(snap(y), 0, $world.clientHeight - h),
  };
}

function rectOf(item) {
  return isContainer(item)
    ? { x: item.x, y: item.y, w: item.width, h: item.height }
    : { x: item.x, y: item.y, w: NODE_W, h: NODE_H };
}
function centerOf(item) {
  const r = rectOf(item);
  return { x: r.x + r.w / 2, y: r.y + r.h / 2 };
}
function inRect(r, p) {
  return p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h;
}
// 테두리 위의 점도 안으로 보는 판정 (VPC 경계선에 걸친 박스용)
function inRectInclusive(r, p) {
  return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}
// 두 사각형이 겹치는지 (변이 맞닿기만 한 경우는 겹침 아님)
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
}

// 상태 스냅샷 (동작이 규칙에 어긋나면 되돌리기용)
const takeSnapshot = () => JSON.parse(JSON.stringify(state));
function restoreSnapshot(s) {
  state.nodes = s.nodes;
  state.containers = s.containers;
  state.edges = s.edges;
}

// 안내 메시지 잠깐 표시
let toastTimer = null;
function showToast(msg, kind = '') {
  $toast.textContent = msg;
  $toast.className = 'toast show ' + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $toast.className = 'toast ' + kind; }, kind === 'warn' ? 3200 : 2200);
}

/* ---------------------------------------------------------
   UI-2. 소속 판정·동작 검사 (규칙 위반이면 되돌리기)
   --------------------------------------------------------- */

// ----- 소속 판정 -----
// 점 p를 품는 가장 안쪽 영역. self(영역)를 판정할 때는 자신보다 큰 영역만 후보로 본다.
// 서비스 박스의 중심이 VPC 경계선 위에 있으면 그 VPC 소속(서브넷 밖)으로 본다.
function innermostContainer(p, self) {
  const selfArea = self ? self.width * self.height : Infinity;
  const selfRank = self ? AREA_MAP[self.type].rank : Infinity;
  let best = null, bestArea = Infinity;
  for (const k of state.containers) {
    if (k === self) continue;
    const hit = (!self && k.type === 'vpc') ? inRectInclusive(rectOf(k), p) : inRect(rectOf(k), p);
    if (!hit) continue;
    const area = k.width * k.height;
    const rank = AREA_MAP[k.type].rank;
    if (self && !(area > selfArea || (area === selfArea && rank < selfRank))) continue;
    if (area < bestArea || (area === bestArea && rank > AREA_MAP[best.type].rank)) {
      best = k;
      bestArea = area;
    }
  }
  return best;
}

// 모든 영역·박스의 소속(parentContainer)을 중심점 기준으로 다시 계산
function recomputeParents() {
  state.containers.forEach(c => {
    const p = innermostContainer(centerOf(c), c);
    c.parentContainer = p ? p.id : null;
  });
  state.nodes.forEach(n => {
    const p = innermostContainer(centerOf(n), null);
    n.parentContainer = p ? p.id : null;
  });
}

// 영역 안에 들어 있는 하위 영역·박스 전체
function getDescendants(cid) {
  const containers = [], nodes = [];
  const walk = id => {
    state.containers.forEach(c => {
      if (c.parentContainer === id) { containers.push(c); walk(c.id); }
    });
    state.nodes.forEach(n => { if (n.parentContainer === id) nodes.push(n); });
  };
  walk(cid);
  return { containers, nodes };
}

// 영역 크기 조절 최솟값: 기본 최소 크기와 안에 든 항목을 모두 덮는 크기 중 큰 값
// (skipX/skipY: 해당 방향 경계선을 따라 함께 움직이는 박스라 그 방향 계산에서만 뺄 id)
function minSizeOf(c, skipX = new Set(), skipY = new Set()) {
  const def = AREA_MAP[c.type];
  let w = def.minW, h = def.minH;
  const d = getDescendants(c.id);
  [...d.containers, ...d.nodes].forEach(item => {
    const r = rectOf(item);
    if (!skipX.has(item.id)) w = Math.max(w, r.x + r.w - c.x);
    if (!skipY.has(item.id)) h = Math.max(h, r.y + r.h - c.y);
  });
  return { w: Math.ceil(w / GRID) * GRID, h: Math.ceil(h / GRID) * GRID };
}

// 움직인 박스(movedIds)가 다른 박스와 겹치는지 검사. 원래 있던 박스가 우선.
// 함께 움직인 박스끼리는 이번 동작으로 새로 겹치게 된 경우만 본다 (VPC 경계선 박스가 서로 다른 경계를 따라 움직인 경우 등).
function findOverlap(before, actedId, movedIds) {
  const moved = new Set(movedIds);
  const prev = new Map(before.nodes.map(n => [n.id, n]));
  const newlyOverlap = (m, n) => {
    if (!rectsOverlap(rectOf(m), rectOf(n))) return false;
    if (!moved.has(n.id)) return true;
    const pm = prev.get(m.id), pn = prev.get(n.id);
    return !(pm && pn && rectsOverlap(rectOf(pm), rectOf(pn)));
  };
  for (const m of state.nodes) {
    if (!moved.has(m.id)) continue;
    const hit = state.nodes.find(n => n !== m && newlyOverlap(m, n));
    if (!hit) continue;
    const other = SVC_MAP[hit.type].name;
    return m.id === actedId
      ? `${other} 박스와 겹쳐요. 빈 곳에 놓아주세요.`
      : `그렇게 하면 ${SVC_MAP[m.type].name} 박스가 ${other} 박스와 겹쳐요. 빈 곳으로 옮겨주세요.`;
  }
  return null;
}

// 같은 단계 영역(VPC끼리, AZ끼리, 서브넷끼리)이 일부라도 겹치는지 검사.
// 이번 동작으로 새로 생기거나 위치·크기가 바뀐 영역만 대상으로 한다.
const RANK_NAME = ['VPC', 'AZ(가용 영역)', '서브넷'];
function findAreaOverlap(before) {
  const prev = new Map(before.containers.map(c => [c.id, c]));
  const changed = new Set(state.containers.filter(c => {
    const p = prev.get(c.id);
    return !p || p.x !== c.x || p.y !== c.y || p.width !== c.width || p.height !== c.height;
  }).map(c => c.id));
  for (const c of state.containers) {
    if (!changed.has(c.id)) continue;
    const rank = AREA_MAP[c.type].rank;
    const hit = state.containers.find(k => k !== c && !changed.has(k.id) &&
      AREA_MAP[k.type].rank === rank && rectsOverlap(rectOf(c), rectOf(k)));
    if (hit) return `${RANK_NAME[rank]}끼리는 겹칠 수 없어요. 겹치지 않는 곳에 놓아주세요.`;
  }
  return null;
}

// 동작 마무리: 소속 재계산 → 규칙 위반이나 겹침이면 원래 상태로 되돌림
// movedIds: 이번 동작으로 위치가 바뀐 서비스 박스 id 목록 (겹침 검사 대상)
function commit(before, actedId, movedIds = []) {
  recomputeParents();
  const violation = findViolation(actedId) || findAreaOverlap(before) || findOverlap(before, actedId, movedIds);
  if (violation) {
    restoreSnapshot(before);
    render();
    showToast(violation, 'warn');
    return false;
  }
  render();
  return true;
}

/* ---------------------------------------------------------
   UI-3. 팔레트·설명 툴팁
   --------------------------------------------------------- */

// ----- 팔레트 생성 -----
function addPaletteSection(title, color, items) {
  const t = document.createElement('div');
  t.className = 'cat-title';
  t.innerHTML = `<span class="cat-dot" style="background:${color}"></span>${title}`;
  $palette.appendChild(t);
  const grid = document.createElement('div');
  grid.className = 'cat-items';
  items.forEach(el => grid.appendChild(el));
  $palette.appendChild(grid);
}

function buildPalette() {
  // 영역 (구조를 먼저 만들도록 맨 위에 배치)
  addPaletteSection('영역', 'var(--vpc)', AREAS.map(area => {
    const el = document.createElement('div');
    el.className = `area-chip area-${area.type}`;
    el.innerHTML = (SUBNET_TYPES.includes(area.type) ? LOCK_SVG : '') + `<span>${area.name}</span>`;
    attachTooltip(el, () => areaTooltip(area.type));
    el.addEventListener('pointerdown', e => startPaletteDrag(e, 'area', area));
    return el;
  }));

  // 서비스
  CATEGORIES.forEach(cat => {
    const items = SERVICES.filter(s => s.category === cat.key);
    if (!items.length) return;
    addPaletteSection(cat.label, cat.color, items.map(svc => {
      const el = document.createElement('div');
      styleServiceBox(el, svc);
      el.textContent = svc.name;
      attachTooltip(el, () => serviceTooltip(svc));
      el.addEventListener('pointerdown', e => startPaletteDrag(e, 'node', svc));
      return el;
    }));
  });
}

// ----- 설명 툴팁 -----
const $tooltip = document.getElementById('tooltip');
const TOOLTIP_DELAY = 400;
let tooltipTimer = null;
let tooltipPos = { x: 0, y: 0 };

function serviceTooltip(svc) {
  const cat = CAT_MAP[svc.category];
  const rec = RECOMMENDED_ZONE[svc.type];
  return `<div class="tt-head">${svc.name}<span class="tt-cat">` +
    `<span class="cat-dot" style="background:${cat.color}"></span>${cat.label}</span></div>` +
    `<div class="tt-desc">${svc.desc}</div>` +
    `<div class="tt-zone">놓는 곳 · <b>${ZONE_TEXT[svc.allowedZone]}</b>${rec ? ` (권장: ${rec})` : ''}</div>`;
}
function areaTooltip(type) {
  const a = AREA_MAP[type], info = AREA_DESC[type];
  return `<div class="tt-head">${a.name}<span class="tt-cat">` +
    `<span class="cat-dot" style="background:var(--vpc)"></span>영역</span></div>` +
    `<div class="tt-desc">${info.desc}</div>` +
    `<div class="tt-zone">놓는 곳 · <b>${info.zone}</b></div>`;
}

// 마우스 근처에 표시하되 화면 밖으로 넘치지 않게
function placeTooltip() {
  const pad = 8, w = $tooltip.offsetWidth, h = $tooltip.offsetHeight;
  let x = tooltipPos.x + 14, y = tooltipPos.y + 18;
  if (x + w > window.innerWidth - pad) x = tooltipPos.x - w - 10;
  if (y + h > window.innerHeight - pad) y = tooltipPos.y - h - 10;
  $tooltip.style.left = Math.max(pad, x) + 'px';
  $tooltip.style.top  = Math.max(pad, y) + 'px';
}

function hideTooltip() {
  clearTimeout(tooltipTimer);
  $tooltip.classList.remove('show');
}
$wrap.addEventListener('scroll', hideTooltip);
$palette.addEventListener('scroll', hideTooltip);

// 요소에 마우스를 잠시 올리면 설명 표시. 드래그 중·연결 모드에서는 표시하지 않음.
function attachTooltip(el, getHtml) {
  el.addEventListener('pointerenter', e => {
    hideTooltip();
    if (e.buttons || connectMode) return;
    tooltipPos = { x: e.clientX, y: e.clientY };
    tooltipTimer = setTimeout(() => {
      $tooltip.innerHTML = getHtml();
      $tooltip.classList.add('show');
      placeTooltip();
    }, TOOLTIP_DELAY);
  });
  el.addEventListener('pointermove', e => {
    if (e.buttons) { hideTooltip(); return; }
    tooltipPos = { x: e.clientX, y: e.clientY };
    if ($tooltip.classList.contains('show')) placeTooltip();
  });
  el.addEventListener('pointerleave', hideTooltip);
  el.addEventListener('pointerdown', hideTooltip);
}

// 서비스 박스 공통 모양에 카테고리 색 적용
function styleServiceBox(el, svc) {
  const cat = CAT_MAP[svc.category];
  el.classList.add('svc');
  el.style.setProperty('--c', cat.color);
  el.style.setProperty('--cbg', cat.bg);
  el.style.setProperty('--cfg', cat.fg);
}

// ----- 팔레트 → 캔버스 드래그 -----
function startPaletteDrag(e, kind, def) {
  if (e.button !== 0) return;
  e.preventDefault();

  const w = kind === 'area' ? def.w : NODE_W;
  const h = kind === 'area' ? def.h : NODE_H;
  const ghost = document.createElement('div');
  if (kind === 'area') {
    ghost.className = `area area-${def.type}`;
  } else {
    styleServiceBox(ghost, def);
    ghost.textContent = def.name;
  }
  ghost.classList.add('ghost');
  ghost.style.width = w + 'px';
  ghost.style.height = h + 'px';
  ghost.style.transform = `scale(${zoom})`;   // 캔버스 줌과 같은 크기로 보이게
  document.body.appendChild(ghost);

  const move = ev => {
    let gx = ev.clientX, gy = ev.clientY;   // 미리보기 박스 중심(화면 좌표)
    const over = isOverCanvas(gx, gy);
    // VPC 경계선 스냅 대상이면 놓았을 때 위치를 미리 보여줌
    if (over && kind === 'node' && EDGE_SNAP_TYPES.includes(def.type)) {
      const p = clientToWorld(gx, gy);
      const pos = fitRect(p.x - NODE_W / 2, p.y - NODE_H / 2, NODE_W, NODE_H);
      const probe = { type: def.type, x: pos.x, y: pos.y };
      if (snapToVpcEdge(probe)) {
        const c = worldToClient(probe.x + NODE_W / 2, probe.y + NODE_H / 2);
        gx = c.x;
        gy = c.y;
      }
    }
    ghost.style.left = (gx - w / 2) + 'px';
    ghost.style.top  = (gy - h / 2) + 'px';
    ghost.classList.toggle('outside', !over);
  };
  const end = ev => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', end);
    window.removeEventListener('pointercancel', end);
    ghost.remove();
    // 캔버스 밖에 놓으면 아무것도 만들지 않음(팔레트 드래그 취소)
    if (ev.type === 'pointerup' && isOverCanvas(ev.clientX, ev.clientY)) {
      const p = clientToWorld(ev.clientX, ev.clientY);
      if (kind === 'area') addContainer(def.type, p.x, p.y);
      else addNode(def.type, p.x, p.y);
    }
  };
  move(e);
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
}

/* ---------------------------------------------------------
   UI-4. 추가·삭제·선택·이동·크기 조절
   --------------------------------------------------------- */

// ----- 추가 / 삭제 / 선택 -----
// (cx, cy) = 놓은 위치(박스 중심)
function addNode(type, cx, cy) {
  const before = takeSnapshot();
  const pos = fitRect(cx - NODE_W / 2, cy - NODE_H / 2, NODE_W, NODE_H);
  const node = { id: newId('n'), type, x: pos.x, y: pos.y, parentContainer: null };
  state.nodes.push(node);
  snapToVpcEdge(node);
  if (commit(before, node.id, [node.id])) select(node.id);
}

// ----- VPC 경계선 스냅 (IGW 등) -----
const EDGE_SNAP_TYPES = ['igw', 'vpce', 'clientvpn'];
const EDGE_SNAP_DIST = NODE_W / 2;   // 박스 중심이 경계선에서 이 거리(px) 안이면 붙임 (박스 모서리가 선에 닿을 정도)

// 경계선 근처면 박스 중심이 VPC 테두리 위에 오도록 좌표 보정. 붙였으면 true.
function snapToVpcEdge(node) {
  if (!EDGE_SNAP_TYPES.includes(node.type)) return false;
  const c = centerOf(node);
  let best = null;
  state.containers.filter(k => k.type === 'vpc').forEach(v => {
    const L = v.x, R = v.x + v.width, T = v.y, B = v.y + v.height;
    const cands = [];
    if (c.y >= T && c.y <= B) cands.push({ x: L, y: c.y, d: Math.abs(c.x - L) }, { x: R, y: c.y, d: Math.abs(c.x - R) });
    if (c.x >= L && c.x <= R) cands.push({ x: c.x, y: T, d: Math.abs(c.y - T) }, { x: c.x, y: B, d: Math.abs(c.y - B) });
    cands.forEach(k => { if (k.d <= EDGE_SNAP_DIST && (!best || k.d < best.d)) best = k; });
  });
  if (!best) return false;
  const x = best.x - NODE_W / 2, y = best.y - NODE_H / 2;
  if (x < 0 || y < 0 || x > $world.clientWidth - NODE_W || y > $world.clientHeight - NODE_H) return false;
  node.x = x;
  node.y = y;
  return true;
}

function nextAzLabel() {
  const used = new Set(state.containers.filter(c => c.type === 'az').map(c => c.label));
  const letter = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].find(l => !used.has('가용 영역 ' + l)) || '?';
  return '가용 영역 ' + letter;
}

function addContainer(type, cx, cy) {
  const before = takeSnapshot();
  const def = AREA_MAP[type];
  const pos = fitRect(cx - def.w / 2, cy - def.h / 2, def.w, def.h);
  const c = {
    id: newId('c'), type, x: pos.x, y: pos.y, width: def.w, height: def.h,
    parentContainer: null, label: type === 'az' ? nextAzLabel() : def.name,
  };
  state.containers.push(c);
  if (commit(before, c.id)) select(c.id);
}

function deleteNode(id) {
  state.nodes = state.nodes.filter(n => n.id !== id);
  state.edges = state.edges.filter(ed => ed.from !== id && ed.to !== id); // 연결선도 함께 제거
  if (selectedId === id) selectedId = null;
  if (connectFrom === id) cancelPendingConnect();
  render();
}

// 영역 삭제: 안에 든 하위 영역·박스·연결선도 함께 삭제
function deleteContainer(id) {
  const d = getDescendants(id);
  const count = d.containers.length + d.nodes.length;
  if (count > 0 && !confirm(`안에 있는 ${count}개 항목도 함께 삭제됩니다. 삭제할까요?`)) return;
  const removeC = new Set([id, ...d.containers.map(c => c.id)]);
  const removeN = new Set(d.nodes.map(n => n.id));
  state.containers = state.containers.filter(c => !removeC.has(c.id));
  state.nodes = state.nodes.filter(n => !removeN.has(n.id));
  state.edges = state.edges.filter(ed => !removeN.has(ed.from) && !removeN.has(ed.to));
  if (removeC.has(selectedId) || removeN.has(selectedId)) selectedId = null;
  if (removeN.has(connectFrom)) cancelPendingConnect();
  render();
}

function deleteEdge(id) {
  state.edges = state.edges.filter(ed => ed.id !== id);
  if (selectedId === id) selectedId = null;
  render();
}

function deleteSelected() {
  if (!selectedId) return;
  const kind = selectedId[0];
  if (kind === 'n') deleteNode(selectedId);
  else if (kind === 'c') deleteContainer(selectedId);
  else if (kind === 'e') deleteEdge(selectedId);
}

// 선택 표시만 바꿈 (DOM을 다시 만들지 않아 드래그 중에도 안전)
function select(id) {
  selectedId = id;
  elMap.forEach((el, key) => el.classList.toggle('selected', key === id));
  renderEdges();
}

// ----- 이동 (서비스 박스 / 영역 + 안의 항목) -----
function startMoveDrag(e, item, el) {
  e.preventDefault();
  e.stopPropagation();
  select(item.id);

  const before = takeSnapshot();
  const group = [item];
  if (isContainer(item)) {
    const d = getDescendants(item.id);
    group.push(...d.containers, ...d.nodes);
  }
  const starts = group.map(g => ({ g, x: g.x, y: g.y }));
  const r = rectOf(item);
  const p0 = clientToWorld(e.clientX, e.clientY);
  const W = $world.clientWidth, H = $world.clientHeight;

  // 함께 움직이는 전체(경계선에 걸친 박스 포함)가 캔버스 안에 머물도록 기준 항목의 좌표 범위 계산
  const box = group.map(rectOf).reduce((b, g) => ({
    x1: Math.min(b.x1, g.x), y1: Math.min(b.y1, g.y),
    x2: Math.max(b.x2, g.x + g.w), y2: Math.max(b.y2, g.y + g.h),
  }), { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity });
  const rangeX = [Math.ceil((r.x - box.x1) / GRID) * GRID, Math.floor((W - (box.x2 - r.x)) / GRID) * GRID];
  const rangeY = [Math.ceil((r.y - box.y1) / GRID) * GRID, Math.floor((H - (box.y2 - r.y)) / GRID) * GRID];

  // 기준 항목의 이동량 계산 (캔버스 범위 안으로 제한)
  const delta = (ev, snapIt) => {
    const p = clientToWorld(ev.clientX, ev.clientY);
    let nx = r.x + p.x - p0.x, ny = r.y + p.y - p0.y;
    if (snapIt) { nx = snap(nx); ny = snap(ny); }
    nx = clamp(nx, rangeX[0], rangeX[1]);
    ny = clamp(ny, rangeY[0], rangeY[1]);
    return { dx: nx - r.x, dy: ny - r.y };
  };
  const apply = ({ dx, dy }) => {
    starts.forEach(s => { s.g.x = s.x + dx; s.g.y = s.y + dy; });
    if (!isContainer(item)) snapToVpcEdge(item);   // 경계선 근처면 바로 붙어 보이게
  };
  const movedIds = group.filter(g => !isContainer(g)).map(g => g.id);

  let moved = false;
  el.setPointerCapture(e.pointerId);
  const move = ev => {
    moved = true;
    el.classList.add('dragging');
    apply(delta(ev, false));
    updatePositions();
  };
  const end = ev => {
    el.removeEventListener('pointermove', move);
    el.removeEventListener('pointerup', end);
    el.removeEventListener('pointercancel', end);
    el.classList.remove('dragging');
    if (ev.type === 'pointerup' && moved) {
      apply(delta(ev, true));
      commit(before, item.id, movedIds);
    } else if (moved) {
      restoreSnapshot(before);
      render();
    }
  };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

// ----- 영역 크기 조절 (corner: 'br' 우하단 / 'tl' 좌상단 손잡이) -----
function startResize(e, c, handle, corner) {
  e.preventDefault();
  e.stopPropagation();
  select(c.id);

  const before = takeSnapshot();
  const p0 = clientToWorld(e.clientX, e.clientY);
  const x0 = c.x, y0 = c.y, w0 = c.width, h0 = c.height;
  const right = x0 + w0, bottom = y0 + h0;
  const tl = corner === 'tl';
  // VPC 경계선에 붙은 박스는 움직이는 쪽 경계선을 따라 함께 움직인다
  const riders = c.type !== 'vpc' ? [] : state.nodes
    .filter(n => n.parentContainer === c.id)
    .map(n => {
      const k = centerOf(n);
      return { n, x: n.x, y: n.y,
        sideX: tl ? k.x === x0 : k.x === right,
        sideY: tl ? k.y === y0 : k.y === bottom };
    })
    .filter(r => r.sideX || r.sideY);
  const riderIds = riders.map(r => r.n.id);
  // 경계선 박스는 따라 움직이는 방향의 한계 계산에서만 뺀다 (다른 방향 경계가 박스를 지나치지 않게)
  const skipX = new Set(riders.filter(r => r.sideX).map(r => r.n.id));
  const skipY = new Set(riders.filter(r => r.sideY).map(r => r.n.id));
  // 경계선 박스가 캔버스 밖으로 나가지 않도록 경계가 갈 수 있는 범위를 줄인다
  const padX = skipX.size ? NODE_W / 2 : 0, padY = skipY.size ? NODE_H / 2 : 0;
  const W = $world.clientWidth, H = $world.clientHeight;

  // 크기 한계: 안에 든 항목보다 작아지지 않게
  let minX, minY, maxX, maxY, min, maxW, maxH;
  if (tl) {
    const def = AREA_MAP[c.type];
    const d = getDescendants(c.id);
    let lx = right - def.minW, ly = bottom - def.minH;
    [...d.containers, ...d.nodes].forEach(item => {
      const r = rectOf(item);
      if (!skipX.has(item.id)) lx = Math.min(lx, r.x);
      if (!skipY.has(item.id)) ly = Math.min(ly, r.y);
    });
    maxX = Math.floor(lx / GRID) * GRID;
    maxY = Math.floor(ly / GRID) * GRID;
    minX = Math.ceil(padX / GRID) * GRID;
    minY = Math.ceil(padY / GRID) * GRID;
  } else {
    min = minSizeOf(c, skipX, skipY);
    maxW = Math.floor((W - padX - c.x) / GRID) * GRID;
    maxH = Math.floor((H - padY - c.y) / GRID) * GRID;
  }

  handle.setPointerCapture(e.pointerId);
  const move = ev => {
    const p = clientToWorld(ev.clientX, ev.clientY);
    if (tl) {
      c.x = clamp(snap(x0 + p.x - p0.x), Math.min(minX, x0), maxX);
      c.y = clamp(snap(y0 + p.y - p0.y), Math.min(minY, y0), maxY);
      c.width  = right - c.x;
      c.height = bottom - c.y;
    } else {
      c.width  = clamp(snap(w0 + p.x - p0.x), min.w, Math.max(maxW, w0));
      c.height = clamp(snap(h0 + p.y - p0.y), min.h, Math.max(maxH, h0));
    }
    riders.forEach(r => {
      if (r.sideX) r.n.x = r.x + (tl ? c.x - x0 : c.width - w0);
      if (r.sideY) r.n.y = r.y + (tl ? c.y - y0 : c.height - h0);
    });
    updatePositions();
  };
  const end = ev => {
    handle.removeEventListener('pointermove', move);
    handle.removeEventListener('pointerup', end);
    handle.removeEventListener('pointercancel', end);
    if (ev.type === 'pointerup') commit(before, c.id, riderIds);
    else { restoreSnapshot(before); render(); }
  };
  handle.addEventListener('pointermove', move);
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
}

/* ---------------------------------------------------------
   UI-5. 연결선 (연결 모드·직각 경로·손잡이·그리기)
   --------------------------------------------------------- */

// ----- 연결 모드 -----
function setConnectMode(on) {
  connectMode = on;
  cancelPendingConnect();
  $btnConnect.classList.toggle('active', on);
  $btnConnect.textContent = on ? '연결 모드 켜짐' : '연결 모드';
  document.body.classList.toggle('connect-mode', on);
  render();
  if (on) showToast('시작 박스를 클릭한 뒤 도착 박스를 클릭하세요. (Esc: 취소)');
}

function cancelPendingConnect() {
  if (!connectFrom) return;
  connectFrom = null;
  connectFromSide = null;
  elMap.forEach(el => el.classList.remove('connect-from'));
  $tempEdge.setAttribute('visibility', 'hidden');
}

// 연결 모드에서 박스 클릭 처리 (종류와 관계없이 연결 허용)
// side: 연결점(변 중앙)을 눌렀으면 그 변, 박스 몸통을 눌렀으면 null(자동)
function handleConnectClick(id, side) {
  if (!connectFrom) {
    connectFrom = id;
    connectFromSide = side;
    elMap.get(id).classList.add('connect-from');
    return;
  }
  if (connectFrom === id) { cancelPendingConnect(); return; }
  const from = connectFrom, fromSide = connectFromSide;
  const dup = state.edges.some(ed =>
    (ed.from === from && ed.to === id) || (ed.from === id && ed.to === from));
  cancelPendingConnect();
  if (dup) { showToast('이미 연결된 박스예요.'); return; }
  state.edges.push({ id: newId('e'), from, to: id, fromSide, toSide: side, mid: null });
  render();
}

// ----- 연결선 경로 (직각) -----
// 연결선 데이터: fromSide/toSide = 연결 변(null이면 자동), mid = 가운데 구간 위치 { axis, value } (null이면 자동)
const SIDES = ['top', 'right', 'bottom', 'left'];
const SIDE_DIR = { top: { x: 0, y: -1 }, right: { x: 1, y: 0 }, bottom: { x: 0, y: 1 }, left: { x: -1, y: 0 } };
const STUB = 20;      // 박스 변에서 수직으로 먼저 나가는 길이
const EDGE_GAP = 3;   // 화살표 끝과 박스 사이 여백
const isHorizSide = s => s === 'left' || s === 'right';

// 박스 변 중앙의 연결점 (gap만큼 바깥)
function anchorPoint(node, side, gap = 0) {
  const c = centerOf(node), d = SIDE_DIR[side];
  return { x: c.x + d.x * (NODE_W / 2 + gap), y: c.y + d.y * (NODE_H / 2 + gap) };
}

// 두 박스의 위치로 자연스러운 연결 변을 고른다
function autoSides(a, b) {
  const ca = centerOf(a), cb = centerOf(b);
  const dx = cb.x - ca.x, dy = cb.y - ca.y;
  if (Math.abs(dx) - NODE_W >= Math.abs(dy) - NODE_H) return dx >= 0 ? ['right', 'left'] : ['left', 'right'];
  return dy >= 0 ? ['bottom', 'top'] : ['top', 'bottom'];
}

// 같은 쪽을 보는 변끼리 연결할 때 두 박스를 피해 돌아가는 위치
function detour(a, b, axis) {
  const ra = rectOf(a), rb = rectOf(b);
  const pos = axis === 'y' ? 'y' : 'x', size = axis === 'y' ? 'h' : 'w';
  if (ra[pos] + ra[size] + 2 * STUB <= rb[pos]) return (ra[pos] + ra[size] + rb[pos]) / 2;
  if (rb[pos] + rb[size] + 2 * STUB <= ra[pos]) return (rb[pos] + rb[size] + ra[pos]) / 2;
  return Math.max(ra[pos] + ra[size], rb[pos] + rb[size]) + STUB * 1.5;
}

// 꺾이는 점 목록에서 중복 점과 같은 방향으로 이어지는 중간 점을 정리
function simplifyPoints(pts) {
  const out = [];
  pts.forEach(p => {
    const last = out[out.length - 1];
    if (last && last.x === p.x && last.y === p.y) return;
    out.push(p);
  });
  for (let i = out.length - 2; i >= 1; i--) {
    const a = out[i - 1], b = out[i], c = out[i + 1];
    const collinear = (a.x === b.x && b.x === c.x) || (a.y === b.y && b.y === c.y);
    const forward = (b.x - a.x) * (c.x - b.x) + (b.y - a.y) * (c.y - b.y) > 0;
    if (collinear && forward) out.splice(i, 1);
  }
  return out;
}

// 연결선 경로 계산 → { points, axis, m, handle(가운데 손잡이 위치), sa, sb(실제 쓴 연결 변) }
// 연결 변과 경로가 모두 자동이면, 다른 박스를 가로지르지 않는 연결 변 조합을 찾는다.
function edgeRoute(ed) {
  const a = findNode(ed.from), b = findNode(ed.to);
  const [autoA, autoB] = autoSides(a, b);
  if (ed.fromSide || ed.toSide || ed.mid) {
    return routeFor(a, b, ed.fromSide || autoA, ed.toSide || autoB, ed.mid);
  }
  // 기본 조합 → ㄷ자로 돌아가는 조합 → ㄱ자 조합 순으로 시도
  const horiz = isHorizSide(autoA);
  const [p1, p2] = horiz ? ['top', 'bottom'] : ['left', 'right'];
  const candidates = [[autoA, autoB], [p1, p1], [p2, p2], [autoA, p1], [autoA, p2], [p1, autoB], [p2, autoB]];
  let best = null;
  for (const [sa, sb] of candidates) {
    const r = routeFor(a, b, sa, sb, null);
    if (!best || r.crossings < best.crossings) best = r;
    if (!r.crossings) break;
  }
  return best;
}

// 정해진 연결 변(sa, sb)으로 경로 계산. mid가 없으면 가운데 구간을 옮겨 가며 박스를 피한다.
function routeFor(a, b, sa, sb, mid) {
  const da = SIDE_DIR[sa], db = SIDE_DIR[sb];
  const S = anchorPoint(a, sa, EDGE_GAP), E = anchorPoint(b, sb, EDGE_GAP);
  const P = { x: S.x + da.x * STUB, y: S.y + da.y * STUB };
  const Q = { x: E.x + db.x * STUB, y: E.y + db.y * STUB };
  const ha = isHorizSide(sa), hb = isHorizSide(sb);

  // axis: 가운데 구간이 세로선이면 'x'(x 위치로 조절), 가로선이면 'y'
  let axis, m;
  if (ha && hb) {
    if (da.x === db.x)               { axis = 'x'; m = da.x > 0 ? Math.max(P.x, Q.x) : Math.min(P.x, Q.x); }
    else if (da.x * (Q.x - P.x) >= 0) { axis = 'x'; m = (P.x + Q.x) / 2; }
    else                              { axis = 'y'; m = detour(a, b, 'y'); }
  } else if (!ha && !hb) {
    if (da.y === db.y)               { axis = 'y'; m = da.y > 0 ? Math.max(P.y, Q.y) : Math.min(P.y, Q.y); }
    else if (da.y * (Q.y - P.y) >= 0) { axis = 'y'; m = (P.y + Q.y) / 2; }
    else                              { axis = 'x'; m = detour(a, b, 'x'); }
  } else if (ha) {   // 시작은 가로 변, 도착은 세로 변 → ㄱ자
    axis = 'x';
    m = (da.x * (Q.x - P.x) >= 0 && db.y * (P.y - Q.y) >= 0) ? Q.x : P.x;
  } else {           // 시작은 세로 변, 도착은 가로 변 → ㄴ자
    axis = 'y';
    m = (da.y * (Q.y - P.y) >= 0 && db.x * (P.x - Q.x) >= 0) ? Q.y : P.y;
  }
  const build = mv => {
    const mids = axis === 'x'
      ? [{ x: mv, y: P.y }, { x: mv, y: Q.y }]
      : [{ x: P.x, y: mv }, { x: Q.x, y: mv }];
    return { pts: [S, P, ...mids, Q, E], mids };
  };
  const skip = [a.id, b.id];
  if (mid && mid.axis === axis) {
    m = mid.value;   // 사용자가 옮긴 경로는 그대로
  } else {
    m = avoidBoxes(m, build, skip);   // 자동 경로는 다른 박스를 피해서
  }

  const { pts, mids } = build(m);
  const handle = { x: (mids[0].x + mids[1].x) / 2, y: (mids[0].y + mids[1].y) / 2 };
  return { points: simplifyPoints(pts), axis, m, handle, sa, sb, crossings: crossingCount(pts, skip) };
}

// 경로가 다른 서비스 박스를 몇 번 가로지르는지 (박스 둘레 여백 포함)
const AVOID_MARGIN = 6;
function crossingCount(pts, skipIds) {
  let count = 0;
  state.nodes.forEach(n => {
    if (skipIds.includes(n.id)) return;
    const r = rectOf(n);
    const x1 = r.x - AVOID_MARGIN, x2 = r.x + r.w + AVOID_MARGIN;
    const y1 = r.y - AVOID_MARGIN, y2 = r.y + r.h + AVOID_MARGIN;
    for (let i = 0; i < pts.length - 1; i++) {
      const p = pts[i], q = pts[i + 1];
      const hit = p.y === q.y
        ? p.y > y1 && p.y < y2 && Math.max(p.x, q.x) > x1 && Math.min(p.x, q.x) < x2
        : p.x > x1 && p.x < x2 && Math.max(p.y, q.y) > y1 && Math.min(p.y, q.y) < y2;
      if (hit) { count++; break; }
    }
  });
  return count;
}

// 가운데 구간 위치(m)를 기본값에서 조금씩 옮겨 보며 박스를 가로지르지 않는 위치를 찾는다.
// 완전히 피할 수 없으면 가장 적게 가로지르는 위치를 쓴다.
function avoidBoxes(m0, build, skipIds) {
  let best = m0, bestCount = crossingCount(build(m0).pts, skipIds);
  for (let k = 1; k <= 40 && bestCount > 0; k++) {
    for (const mv of [m0 + k * GRID / 2, m0 - k * GRID / 2]) {
      const c = crossingCount(build(mv).pts, skipIds);
      if (c < bestCount) { best = mv; bestCount = c; if (!c) break; }
    }
  }
  return best;
}

const pathD = pts => pts.map((p, i) => `${i ? 'L' : 'M'}${p.x},${p.y}`).join(' ');

// 연결선 끝 손잡이를 끌어 같은 박스의 다른 변으로 옮기기
function startEndpointDrag(e, ed, end) {
  e.preventDefault();
  e.stopPropagation();
  const node = findNode(end === 'from' ? ed.from : ed.to);
  const key = end === 'from' ? 'fromSide' : 'toSide';
  const otherKey = end === 'from' ? 'toSide' : 'fromSide';
  const cur = edgeRoute(ed);   // 반대쪽 끝은 지금 보이는 변으로 고정 (자동 경로가 다른 변을 골랐을 수 있음)
  const move = ev => {
    const p = clientToWorld(ev.clientX, ev.clientY);
    let best = null, bestD = Infinity;
    SIDES.forEach(s => {
      const q = anchorPoint(node, s);
      const d = Math.hypot(q.x - p.x, q.y - p.y);
      if (d < bestD) { bestD = d; best = s; }
    });
    if (ed[key] !== best) {
      if (!ed[otherKey]) ed[otherKey] = end === 'from' ? cur.sb : cur.sa;
      ed[key] = best;
      ed.mid = null;   // 변이 바뀌면 경로는 자동으로
      changed = true;
      renderEdges();
    }
  };
  let changed = false;
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    if (changed) render();   // 클릭만 했으면 다시 그리지 않음 (더블클릭 인식용)
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

// 가운데 손잡이를 끌어 경로(가운데 구간)를 평행 이동
function startMidDrag(e, ed, axis) {
  e.preventDefault();
  e.stopPropagation();
  let changed = false;
  const cur = edgeRoute(ed);   // 지금 보이는 연결 변을 고정해야 옮긴 경로가 유지됨
  const move = ev => {
    const p = clientToWorld(ev.clientX, ev.clientY);
    const value = Math.round(p[axis] / (GRID / 2)) * (GRID / 2);
    if (ed.mid && ed.mid.axis === axis && ed.mid.value === value) return;
    if (!ed.fromSide) ed.fromSide = cur.sa;
    if (!ed.toSide) ed.toSide = cur.sb;
    ed.mid = { axis, value };
    changed = true;
    renderEdges();
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    if (changed) render();   // 클릭만 했으면 다시 그리지 않음 (더블클릭 인식용)
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

// ----- 연결선 그리기 -----
const edgePoints = new Map();   // 연결선 id → 지금 그려진 경로 점 (동적 흐름용)
let hoverEdgeId = null;   // 마우스를 올린 연결선
const $edgeLayer = document.getElementById('edge-layer');

// 연결선 강조: 해당 선과 양 끝 박스를 돋보이게 하고 나머지 선은 흐리게
function setHoverEdge(id) {
  if (hoverEdgeId === id) return;
  hoverEdgeId = id;
  $edgeLayer.classList.toggle('dimmed', !!id);
  const ed = id && state.edges.find(e => e.id === id);
  $edgeG.querySelectorAll('.edge').forEach(p => p.classList.toggle('hl', p.dataset.id === id));
  elMap.forEach((el, key) => el.classList.toggle('edge-end', !!ed && (key === ed.from || key === ed.to)));
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

function renderEdges() {
  $edgeG.innerHTML = '';
  $handleG.innerHTML = '';
  edgePoints.clear();
  state.edges.forEach(ed => {
    const a = findNode(ed.from), b = findNode(ed.to);
    if (!a || !b) return;
    const route = edgeRoute(ed);
    const d = pathD(route.points);
    const sel = ed.id === selectedId;
    const marker = `url(#${sel ? 'arrow-sel' : 'arrow'})`;
    const line = svgEl('path', { d, class: 'edge' + (sel ? ' selected' : ''),
      'marker-start': marker, 'marker-end': marker, 'data-id': ed.id });
    const hit = svgEl('path', { d, class: 'edge-hit' });   // 클릭하기 쉽게 넓은 투명 선
    const pts = route.points;
    edgePoints.set(ed.id, pts);   // 동적 흐름 점이 따라갈 경로
    // 마우스를 올리면 이 선만 진하게, 나머지 선은 흐리게
    if (ed.id === hoverEdgeId) line.classList.add('hl');
    hit.addEventListener('pointerenter', () => setHoverEdge(ed.id));
    hit.addEventListener('pointerleave', () => setHoverEdge(null));
    hit.addEventListener('pointerdown', ev => {
      ev.stopPropagation();
      cancelPendingConnect();
      // 이미 선택된 선의 끝부분(화살촉 근처)을 잡으면 끝점 끌기로 처리
      if (ed.id === selectedId && !connectMode) {
        const p = clientToWorld(ev.clientX, ev.clientY);
        const dist = q => Math.hypot(q.x - p.x, q.y - p.y);
        const dFrom = dist(pts[0]), dTo = dist(pts[pts.length - 1]);
        if (Math.min(dFrom, dTo) <= 16) {
          startEndpointDrag(ev, ed, dTo <= dFrom ? 'to' : 'from');
          return;
        }
      }
      select(ed.id);
    });
    $edgeG.append(line, hit);
    if (!sel || connectMode) return;

    // 선택된 연결선: 양 끝(연결 변 바꾸기) + 가운데(경로 옮기기) 손잡이. 더블클릭하면 자동으로 되돌림.
    // 손잡이는 박스 위 레이어에 그려서 박스·다른 선에 가려지지 않게 한다.
    [['from', pts[0]], ['to', pts[pts.length - 1]]].forEach(([end, p]) => {
      const h = svgEl('g', { class: 'edge-handle' });
      h.append(svgEl('circle', { cx: p.x, cy: p.y, r: 11, class: 'handle-hit' }),
               svgEl('circle', { cx: p.x, cy: p.y, r: 5, class: 'handle-shape' }));
      h.addEventListener('pointerdown', ev => startEndpointDrag(ev, ed, end));
      h.addEventListener('dblclick', () => { ed[end === 'from' ? 'fromSide' : 'toSide'] = null; ed.mid = null; render(); });
      $handleG.appendChild(h);
    });
    const { x: hx, y: hy } = route.handle;
    const mh = svgEl('g', { class: `edge-handle mid-${route.axis}` });
    mh.append(svgEl('circle', { cx: hx, cy: hy, r: 11, class: 'handle-hit' }),
              svgEl('rect', { x: hx - 5, y: hy - 5, width: 10, height: 10, rx: 2, class: 'handle-shape' }));
    mh.addEventListener('pointerdown', ev => startMidDrag(ev, ed, route.axis));
    mh.addEventListener('dblclick', () => { ed.mid = null; ed.fromSide = null; ed.toSide = null; render(); });   // 완전 자동으로
    $handleG.appendChild(mh);
  });
}

   UI-6. 그리기 (영역·박스 DOM 생성, 전체 다시 그리기)

function buildAreaEl(c) {
  const el = document.createElement('div');
  el.className = `area area-${c.type}`;
  el.dataset.id = c.id;

  const label = document.createElement('div');
  label.className = 'area-label';
  if (c.type === 'vpc') label.innerHTML = '<span class="vpc-tag">VPC</span>';
  else if (c.type === 'az') label.textContent = c.label;
  else label.innerHTML = LOCK_SVG + `<span>${c.label}</span>`;
  attachTooltip(label, () => areaTooltip(c.type));   // 영역은 이름표에서만 설명 표시
  el.appendChild(label);

  const del = document.createElement('div');
  del.className = 'del';
  del.textContent = '×';
  del.title = '영역 삭제';
  del.addEventListener('pointerdown', ev => ev.stopPropagation());
  del.addEventListener('click', ev => { ev.stopPropagation(); deleteContainer(c.id); });
  el.appendChild(del);

  // 크기 조절 손잡이: 좌상단(tl) / 우하단(br)
  ['tl', 'br'].forEach(corner => {
    const handle = document.createElement('div');
    handle.className = `resize ${corner}`;
    handle.dataset.corner = corner;
    handle.title = '크기 조절';
    el.appendChild(handle);
  });

  el.addEventListener('pointerdown', ev => {
    if (ev.button !== 0) return;
    if (connectMode) { ev.stopPropagation(); cancelPendingConnect(); return; }
    const handle = ev.target.closest('.resize');
    if (handle) startResize(ev, c, handle, handle.dataset.corner);
    else startMoveDrag(ev, c, el);
  });
  return el;
}

function buildNodeEl(node) {
  const svc = SVC_MAP[node.type];
  const el = document.createElement('div');
  el.className = 'node';
  styleServiceBox(el, svc);
  el.dataset.id = node.id;

  const label = document.createElement('span');
  label.textContent = svc.name;
  el.appendChild(label);
  attachTooltip(el, () => serviceTooltip(svc));

  const del = document.createElement('div');
  del.className = 'del';
  del.textContent = '×';
  del.title = '삭제';
  del.addEventListener('pointerdown', ev => ev.stopPropagation());
  del.addEventListener('click', ev => { ev.stopPropagation(); deleteNode(node.id); });
  el.appendChild(del);

  // 연결점 (네 변의 중앙)
  SIDES.forEach(side => {
    const a = document.createElement('div');
    a.className = 'anchor';
    a.dataset.side = side;
    el.appendChild(a);
  });

  el.addEventListener('pointerdown', ev => {
    if (ev.button !== 0) return;
    if (connectMode) {
      ev.preventDefault();
      ev.stopPropagation();
      const anchor = ev.target.closest('.anchor');
      handleConnectClick(node.id, anchor ? anchor.dataset.side : null);
      return;
    }
    startMoveDrag(ev, node, el);
  });
  return el;
}

// 위치·크기만 갱신 (드래그 중 사용)
function updatePositions() {
  [...state.containers, ...state.nodes].forEach(item => {
    const el = elMap.get(item.id);
    if (!el) return;
    el.style.left = item.x + 'px';
    el.style.top  = item.y + 'px';
    if (isContainer(item)) {
      el.style.width  = item.width + 'px';
      el.style.height = item.height + 'px';
    }
  });
  renderEdges();
}

// 전체 다시 그리기
function render() {
  hideTooltip();   // 다시 그리면 마우스 아래 요소가 바뀌므로 툴팁·연결선 강조 정리
  setHoverEdge(null);
  elMap.clear();
  $areaLayer.innerHTML = '';
  $nodeLayer.innerHTML = '';

  // 바깥 영역부터 그려서 안쪽 영역이 위에 보이도록
  [...state.containers]
    .sort((a, b) => AREA_MAP[a.type].rank - AREA_MAP[b.type].rank)
    .forEach(c => {
      const el = buildAreaEl(c);
      elMap.set(c.id, el);
      $areaLayer.appendChild(el);
    });
  state.nodes.forEach(n => {
    const el = buildNodeEl(n);
    if (n.id === connectFrom) el.classList.add('connect-from');
    elMap.set(n.id, el);
    $nodeLayer.appendChild(el);
  });
  elMap.forEach((el, id) => el.classList.toggle('selected', id === selectedId));
  updatePositions();

  if (!connectFrom) $tempEdge.setAttribute('visibility', 'hidden');
  $emptyHint.classList.toggle('hidden', state.nodes.length + state.containers.length > 0);

  // 검증 후 캔버스가 바뀌었으면 이전 결과는 지운다
  if (validation && validation.sig !== stateSig()) {
    validation = null;
    resultNote = '구성이 바뀌었어요. [검증하기]를 다시 눌러 확인해보세요.';
  }
  applyValidationMarks();
  renderResult();
  syncFlow();
  saveState();
}
