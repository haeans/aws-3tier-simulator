   UI-7. 줌·저장
   --------------------------------------------------------- */

// ----- 줌 -----
const ZOOM_STEPS = [0.6, 0.75, 0.9, 1, 1.1, 1.25, 1.5];   // 60% 미만은 격자가 보이지 않아 제외

function applyZoom() {
  $world.style.transform = `scale(${zoom})`;
  $sizer.style.width  = $world.offsetWidth * zoom + 'px';
  $sizer.style.height = $world.offsetHeight * zoom + 'px';
  $zoomLabel.textContent = Math.round(zoom * 100) + '%';
}

// anchor(화면 좌표) 아래의 캔버스 지점이 그대로 보이도록 배율 변경. 없으면 화면 중앙 기준.
function setZoom(z, anchor) {
  z = clamp(z, ZOOM_STEPS[0], ZOOM_STEPS[ZOOM_STEPS.length - 1]);
  if (z === zoom) return;
  const r = $wrap.getBoundingClientRect();
  const ax = anchor ? anchor.x - r.left : $wrap.clientWidth / 2;
  const ay = anchor ? anchor.y - r.top  : $wrap.clientHeight / 2;
  const wx = ($wrap.scrollLeft + ax) / zoom;
  const wy = ($wrap.scrollTop + ay) / zoom;
  zoom = z;
  applyZoom();
  $wrap.scrollLeft = wx * zoom - ax;
  $wrap.scrollTop  = wy * zoom - ay;
  saveState();
}

// dir: +1 확대, -1 축소 (단계별)
function stepZoom(dir, anchor) {
  const next = dir > 0
    ? ZOOM_STEPS.find(s => s > zoom + 1e-6)
    : [...ZOOM_STEPS].reverse().find(s => s < zoom - 1e-6);
  if (next) setZoom(next, anchor);
}

// ----- 저장 / 불러오기 (브라우저 localStorage) -----
const STORAGE_KEY = 'aws-t3-sim:v1';
let lastSaved = null;
let savedScroll = null;   // 불러온 스크롤 위치 (시작 시 한 번 적용)

function saveState() {
  const scroll = { x: $wrap.scrollLeft, y: $wrap.scrollTop };   // 보고 있던 캔버스 시점
  const data = JSON.stringify({ version: 1, idSeq, zoom, scroll, state });
  if (data === lastSaved) return;
  try {
    localStorage.setItem(STORAGE_KEY, data);
    lastSaved = data;
  } catch (e) { /* 저장소를 쓸 수 없는 환경이면 저장 생략 */ }
}

// 저장된 배치를 불러온다. 알 수 없는 항목은 버리고, 불러온 항목 수를 돌려준다.
function loadSaved() {
  let data;
  try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return 0; }
  if (!data || !data.state) return 0;
  const s = data.state;
  const nodes = (Array.isArray(s.nodes) ? s.nodes : []).filter(n => n && SVC_MAP[n.type]);
  const containers = (Array.isArray(s.containers) ? s.containers : []).filter(c => c && AREA_MAP[c.type]);
  const nodeIds = new Set(nodes.map(n => n.id));
  const edges = (Array.isArray(s.edges) ? s.edges : [])
    .filter(ed => ed && nodeIds.has(ed.from) && nodeIds.has(ed.to));
  state.nodes = nodes;
  state.containers = containers;
  state.edges = edges;

  // 새 id가 기존 id와 겹치지 않도록 번호 이어가기
  const maxId = Math.max(0, ...[...nodes, ...containers, ...edges]
    .map(i => parseInt(String(i.id).slice(1), 10) || 0));
  idSeq = Math.max(Number(data.idSeq) || 1, maxId + 1);
  if (typeof data.zoom === 'number') {
    zoom = clamp(data.zoom, ZOOM_STEPS[0], ZOOM_STEPS[ZOOM_STEPS.length - 1]);
  }
  if (data.scroll) savedScroll = data.scroll;
  recomputeParents();
  return nodes.length + containers.length;
}

/* ---------------------------------------------------------
   UI-8. 검증 결과 표시 (규칙 자체는 "검증 규칙" 구역)
   --------------------------------------------------------- */

// 검증에 영향을 주는 부분만 비교 (연결선 경로·연결 변 조절은 제외)
const stateSig = () => JSON.stringify({
  nodes: state.nodes, containers: state.containers,
  edges: state.edges.map(ed => [ed.from, ed.to]),
});
const LEVEL_TEXT = { error: '오류', warn: '경고' };
const STATUS_TEXT = {
  ok:    { label: '정상', desc: 'T-3 아키텍처의 기본 흐름이 모두 갖춰졌어요!' },
  warn:  { label: '경고', desc: '동작은 하지만 권장 구성은 아니에요.' },
  error: { label: '오류', desc: '이대로는 서비스가 동작하지 않아요.' },
};

function runValidation() {
  if (!state.nodes.length) {
    validation = null;
    resultNote = '서비스를 먼저 배치해주세요.';
    showToast('서비스를 먼저 배치해주세요.', 'warn');
    render();
    return;
  }
  validation = { sig: stateSig(), ...validateArchitecture() };
  validation.flow = computeFlow(validation.nodeLevels);
  render();
}

// ----- 동적 흐름: 검증 후 사용자 쪽에서 안쪽으로 연결선 위를 점이 흐른다 -----
// 정상=초록(보통 속도), 경고(병목)=노랑(느림), 오류=빨강(아주 느림). 성능 계산이 아니라 검증 결과를 보여주는 표시.
const FLOW_SPEED = { ok: 90, warn: 38, error: 14 };   // px/초
const FLOW_COLOR = { ok: '#2e9e47', warn: '#e0a800', error: '#d13212' };
const FLOW_SOURCES = [...USER_TYPES, 'dbadmin'];
const $flowG = document.getElementById('flow-g');
let flowRaf = null, flowFor = null, flowDots = [];

// 사용자 박스에서 연결을 따라가며 거리를 매겨 방향을 정한다 (가까운 쪽 → 먼 쪽). 사용자와 이어지지 않은 선은 흐르지 않음.
function computeFlow(nodeLevels) {
  const adj = new Map(state.nodes.map(n => [n.id, []]));
  state.edges.forEach(e => {
    if (adj.has(e.from) && adj.has(e.to)) { adj.get(e.from).push(e.to); adj.get(e.to).push(e.from); }
  });
  const queue = state.nodes.filter(n => FLOW_SOURCES.includes(n.type)).map(n => n.id);
  const dist = new Map(queue.map(id => [id, 0]));
  for (let i = 0; i < queue.length; i++) {
    adj.get(queue[i]).forEach(nb => {
      if (!dist.has(nb)) { dist.set(nb, dist.get(queue[i]) + 1); queue.push(nb); }
    });
  }
  return state.edges
    .filter(e => dist.has(e.from) && dist.has(e.to))
    .map(e => {
      const lv = [nodeLevels.get(e.from), nodeLevels.get(e.to)];
      return {
        id: e.id,
        reverse: dist.get(e.to) < dist.get(e.from),
        level: lv.includes('error') ? 'error' : lv.includes('warn') ? 'warn' : 'ok',
      };
    });
}

const polyLength = pts => pts.slice(1).reduce((s, p, i) => s + Math.abs(p.x - pts[i].x) + Math.abs(p.y - pts[i].y), 0);
function pointAlong(pts, d) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], len = Math.abs(b.x - a.x) + Math.abs(b.y - a.y);
    if (d <= len || i === pts.length - 2) {
      const t = len ? Math.min(1, d / len) : 0;
      return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
    }
    d -= len;
  }
  return pts[0];
}

function stopFlow() {
  cancelAnimationFrame(flowRaf);
  flowRaf = null;
  flowFor = null;
  flowDots = [];
  $flowG.innerHTML = '';
}

// 검증 결과가 있으면 흐름을 시작하고, 없어지면 멈춘다 (render()마다 호출)
function syncFlow() {
  if (!validation || !validation.flow || !validation.flow.length) { if (flowFor) stopFlow(); return; }
  if (flowFor === validation) return;   // 이미 이 결과로 흐르는 중
  stopFlow();
  flowFor = validation;
  validation.flow.forEach(f => {
    const pts = edgePoints.get(f.id);
    if (!pts) return;
    const count = Math.max(1, Math.min(4, Math.round(polyLength(pts) / 140)));
    for (let i = 0; i < count; i++) {
      const dot = svgEl('circle', { r: 4, class: 'flow-dot', fill: FLOW_COLOR[f.level] });
      $flowG.appendChild(dot);
      flowDots.push({ f, dot, phase: i / count });
    }
  });
  const tick = now => {
    flowDots.forEach(({ f, dot, phase }) => {
      const pts = edgePoints.get(f.id);   // 경로를 조절하면 바뀐 경로를 따라감
      if (!pts) { dot.setAttribute('visibility', 'hidden'); return; }
      const path = f.reverse ? [...pts].reverse() : pts;
      const len = polyLength(path);
      const p = pointAlong(path, ((now / 1000) * FLOW_SPEED[f.level] + phase * len) % len);
      dot.setAttribute('cx', p.x);
      dot.setAttribute('cy', p.y);
      dot.setAttribute('visibility', 'visible');
    });
    flowRaf = requestAnimationFrame(tick);
  };
  flowRaf = requestAnimationFrame(tick);
}

// 문제 있는 박스에 빨강/노랑 테두리와 ! 표시
function applyValidationMarks() {
  if (!validation) return;
  validation.suggestNodes.forEach(id => {
    const el = elMap.get(id);
    if (el) el.classList.add('v-suggest');
  });
  validation.nodeLevels.forEach((level, id) => {
    const el = elMap.get(id);
    if (!el) return;
    el.classList.add(level === 'error' ? 'v-error' : 'v-warn');
    const badge = document.createElement('div');
    badge.className = 'v-badge';
    badge.textContent = '!';
    el.appendChild(badge);
  });
}

function renderResult() {
  $result.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'result-head';
  head.innerHTML = '<span class="label">검증 결과</span>';
  $result.appendChild(head);

  if (!validation) {
    head.insertAdjacentHTML('beforeend', `<span class="msg">${resultNote}</span>`);
    return;
  }
  const st = STATUS_TEXT[validation.status];
  const errors = validation.issues.filter(i => i.rule.level === 'error').length;
  const warns = validation.issues.length - errors;
  const counts = [];
  if (validation.issues.length) counts.push(`오류 ${errors}개 · 경고 ${warns}개`);
  if (validation.suggestions.length) counts.push(`제안 ${validation.suggestions.length}개`);
  head.insertAdjacentHTML('beforeend',
    `<span class="status ${validation.status}">${st.label}</span>` +
    `<span class="msg">${st.desc}${counts.length ? ` (${counts.join(' · ')})` : ''}</span>`);
  if (validation.flow && validation.flow.length) {
    $result.insertAdjacentHTML('beforeend', '<div class="flow-legend">연결선 위 흐름 ·' +
      `<span><i style="background:${FLOW_COLOR.ok}"></i>정상</span>` +
      `<span><i style="background:${FLOW_COLOR.warn}"></i>병목(느림)</span>` +
      `<span><i style="background:${FLOW_COLOR.error}"></i>오류(거의 멈춤)</span></div>`);
  }

  // 목록 한 줄: 클릭하면 관련 박스로 이동·선택
  const makeItem = (cls, lv, title, text, action, nodeIds) => {
    const li = document.createElement('li');
    li.className = `issue ${cls}`;
    li.innerHTML = `<span class="lv">${lv}</span><span class="rt">${title}</span><span class="im"></span>`;
    const im = li.querySelector('.im');
    im.textContent = text;
    if (action) {
      const act = document.createElement('span');
      act.className = 'act';
      act.textContent = '→ ' + action;
      im.appendChild(act);
    }
    const target = nodeIds.find(id => elMap.has(id));
    if (target) {
      li.classList.add('clickable');
      li.title = '클릭하면 해당 박스로 이동해요';
      li.addEventListener('click', () => {
        select(target);
        elMap.get(target).scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
      });
    }
    return li;
  };

  if (validation.issues.length) {
    const list = document.createElement('ul');
    list.className = 'issues';
    validation.issues.forEach(issue => list.appendChild(makeItem(issue.rule.level, LEVEL_TEXT[issue.rule.level],
      `규칙 ${issue.rule.id}. ${issue.rule.message}`, issue.message, '', issue.nodeIds)));
    $result.appendChild(list);
  }

  // 개선·제거 제안 (판정과 별개)
  if (validation.suggestions.length) {
    const title = document.createElement('div');
    title.className = 'suggest-title';
    title.textContent = '더 나은 설계를 위한 제안';
    $result.appendChild(title);
    const list = document.createElement('ul');
    list.className = 'issues';
    validation.suggestions.forEach(s => list.appendChild(makeItem(s.rule.kind, s.rule.kind === 'improve' ? '개선' : '제거',
      `제안 ${s.rule.id}. ${s.rule.title}`, s.reason, s.action, s.nodeIds)));
    $result.appendChild(list);
  }
}

   UI-9. 기본 틀·이벤트 바인딩·시작

// ----- 기본 틀 (VPC 1개 + AZ 2개 + AZ별 퍼블릭/프라이빗/DB 서브넷) -----
function loadTemplate() {
  const hasContent = state.nodes.length + state.containers.length > 0;
  if (hasContent && !confirm('캔버스의 기존 내용을 모두 지우고 기본 틀을 만들까요?')) return;

  state.nodes = [];
  state.edges = [];
  state.containers = [];
  selectedId = null;
  cancelPendingConnect();

  const make =(type, x, y, width, height, label) => state.containers.push({
    id: newId('c'), type, x, y, width, height, parentContainer: null,
    label: label || AREA_MAP[type].name,
  });
  make('vpc', 280, 80, 1000, 660);
  [['A', 320], ['B', 800]].forEach(([letter, x]) => {
    make('az', x, 140, 440, 560, '가용 영역 ' + letter);
    make('public',  x + 20, 200, 400, 140);
    make('private', x + 20, 360, 400, 140);
    make('db',      x + 20, 520, 400, 140);
  });
  recomputeParents();
  render();
  $wrap.scrollTo(0, 0);
  showToast('기본 틀을 만들었어요. 사용자는 VPC 왼쪽 바깥에 놓아보세요.');
}

// ----- 이벤트 바인딩 -----
// 빈 캔버스 클릭 → 선택 해제 / 연결 대기 취소
$world.addEventListener('pointerdown', () => {
  cancelPendingConnect();
  select(null);
});

// 연결선 위가 아니면 강조 해제 (선이 다시 그려져 pointerleave를 놓친 경우 대비)
$world.addEventListener('pointermove', e => {
  if (hoverEdgeId && !e.target.closest('.edge-hit, .edge-handle')) setHoverEdge(null);
});

// 연결 대기 중이면 포인터까지 점선 표시
$world.addEventListener('pointermove', e => {
  if (!connectMode || !connectFrom) return;
  const from = findNode(connectFrom);
  if (!from) return;
  const c = connectFromSide ? anchorPoint(from, connectFromSide) : centerOf(from);
  const p = clientToWorld(e.clientX, e.clientY);
  $tempEdge.setAttribute('x1', c.x);
  $tempEdge.setAttribute('y1', c.y);
  $tempEdge.setAttribute('x2', p.x);
  $tempEdge.setAttribute('y2', p.y);
  $tempEdge.setAttribute('visibility', 'visible');
});

// Delete / Backspace → 선택 항목 삭제, Esc → 연결 대기 취소 → 연결 모드 끄기 → 선택 해제
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) {
    e.preventDefault();
    deleteSelected();
  } else if (e.key === 'Escape') {
    if (connectFrom) cancelPendingConnect();
    else if (connectMode) setConnectMode(false);
    else select(null);
  }
});

$btnConnect.addEventListener('click', () => setConnectMode(!connectMode));
document.getElementById('btn-template').addEventListener('click', loadTemplate);
document.getElementById('btn-validate').addEventListener('click', runValidation);

// 초기화
document.getElementById('btn-reset').addEventListener('click', () => {
  const count = state.nodes.length + state.containers.length;
  if (!count) { showToast('캔버스가 이미 비어 있어요.'); return; }
  if (!confirm('캔버스의 모든 내용을 지울까요?')) return;
  state.nodes = [];
  state.containers = [];
  state.edges = [];
  selectedId = null;
  cancelPendingConnect();
  render();
  showToast('캔버스를 초기화했어요.');
});

// 스크롤하는 동안만 스크롤바 표시 (멈추고 1초 뒤 숨김)
document.querySelectorAll('.autohide-scroll').forEach(el => {
  let timer = null;
  el.addEventListener('scroll', () => {
    el.classList.add('scrolling');
    clearTimeout(timer);
    timer = setTimeout(() => el.classList.remove('scrolling'), 1000);
  }, { passive: true });
});

// 줌: 버튼 / Ctrl+휠
document.getElementById('zoom-in').addEventListener('click', () => stepZoom(1));
document.getElementById('zoom-out').addEventListener('click', () => stepZoom(-1));
$zoomLabel.addEventListener('click', () => setZoom(1));
let wheelAcc = 0;   // 터치패드처럼 작은 휠 값이 연달아 올 때 모아서 한 단계씩
$wrap.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) < 40) return;
  stepZoom(wheelAcc < 0 ? 1 : -1, { x: e.clientX, y: e.clientY });
  wheelAcc = 0;
}, { passive: false });

// ----- 시작 -----
buildPalette();
const restored = loadSaved();
applyZoom();
if (savedScroll) {   // render()가 저장하기 전에 시점부터 복원
  $wrap.scrollLeft = Number(savedScroll.x) || 0;
  $wrap.scrollTop  = Number(savedScroll.y) || 0;
}
render();
// 스크롤(보고 있던 시점)이 바뀌면 잠시 뒤 저장
let scrollSaveTimer = null;
$wrap.addEventListener('scroll', () => {
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(saveState, 300);
});
if (restored) showToast('이전에 작업하던 배치를 불러왔어요.');
</script>
</body>
</html>
